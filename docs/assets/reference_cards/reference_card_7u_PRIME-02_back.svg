<svg xmlns="http://www.w3.org/2000/svg" width="114.0mm" height="35.0mm" viewBox="0 0 1140 350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
      .font-mono { font-family: 'Space Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- 114.0 x 35.0 mm Cut Cell Background (2.6mm L/R & 2.2mm T/B symmetric white safe margin) -->
  <rect x="0" y="0" width="1140" height="350" fill="#ffffff" />

  
  <!-- ACTIVITY 1 PANEL (x=26..565, y=22..282) -->
  <g transform="translate(26, 22)">
    <rect x="0" y="0" width="539" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" />
    <rect x="0" y="0" width="539" height="38" rx="8" fill="#0f172a" />
    <rect x="6" y="5" width="118" height="28" rx="5" fill="#0284c7" />
    <text x="65.0" y="24" class="font-mono" font-size="15px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 1</text>
    <text x="132" y="25" class="font-mono" font-size="17.5px" font-weight="700" fill="#ffffff">FACTORING 3,289 = 11 × 13 × 23</text>

    <!-- Left Illustrated Block Diagram (198 x 208) -->
    <g transform="translate(8, 44)">
      <rect x="0" y="0" width="198" height="208" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
      <svg x="4" y="4" width="190" height="200" viewBox="0 0 190 165" preserveAspectRatio="xMidYMid meet">
        
      <text x="95" y="16" class="font-mono" font-size="11.5px" font-weight="700" text-anchor="middle" fill="#0f172a">FULL STACK = 3,289</text>
      <line x1="18" y1="23" x2="172" y2="23" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4,2" />
      <rect x="42" y="27" width="106" height="36" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.3" />
      <text x="95" y="50" class="font-mono" font-size="15px" font-weight="700" text-anchor="middle" fill="#0f172a">[23]</text>
      <rect x="42" y="63" width="106" height="32" rx="3" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.3" />
      <text x="95" y="84" class="font-mono" font-size="15px" font-weight="700" text-anchor="middle" fill="#0f172a">[13]</text>
      <rect x="42" y="95" width="106" height="30" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.3" />
      <text x="95" y="115" class="font-mono" font-size="15px" font-weight="700" text-anchor="middle" fill="#0f172a">[11]</text>
      <rect x="28" y="125" width="134" height="16" rx="2" fill="#cbd5e1" stroke="#334155" stroke-width="1.3" />
      <text x="95" y="137" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#0f172a">SOCKET 3289</text>
      <text x="95" y="157" class="font-mono" font-size="11.5px" font-weight="700" text-anchor="middle" fill="#0f172a">11 × 13 × 23 = 3,289</text>
      </svg>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(214, 44)">
        <rect x="0" y="0" width="317" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
        <circle cx="18" cy="16" r="11" fill="#0f172a" />
        <text x="18" y="21" class="font-mono" font-size="14.5px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="35" y="21" class="font-mono" font-size="16px" font-weight="700" fill="#0f172a">TARGET 3,289</text>
        <text x="12" y="42" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">Inspect socket 3289 (or stage [11],</text><text x="12" y="59.5" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">[13], [23] on lid).</text>
      </g>
      <g transform="translate(214, 115)">
        <rect x="0" y="0" width="317" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
        <circle cx="18" cy="16" r="11" fill="#0f172a" />
        <text x="18" y="21" class="font-mono" font-size="14.5px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="35" y="21" class="font-mono" font-size="16px" font-weight="700" fill="#0f172a">DIVISIBLE BY 11</text>
        <text x="12" y="42" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">3 − 2 + 8 − 9 = 0 → 3,289 ÷ 11 = 299</text><text x="12" y="59.5" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">= 13 × 23.</text>
      </g>
      <g transform="translate(214, 186)">
        <rect x="0" y="0" width="317" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
        <circle cx="18" cy="16" r="11" fill="#0f172a" />
        <text x="18" y="21" class="font-mono" font-size="14.5px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="35" y="21" class="font-mono" font-size="16px" font-weight="700" fill="#0f172a">BUILD FULL STACK</text>
        <text x="12" y="42" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">Stack [11]+[13]+[23] in socket 3289</text><text x="12" y="59.5" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">for a full stack!</text>
      </g>
  </g>
  <!-- ACTIVITY 2 PANEL (x=575..1114, y=22..282) -->
  <g transform="translate(575, 22)">
    <rect x="0" y="0" width="539" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" />
    <rect x="0" y="0" width="539" height="38" rx="8" fill="#0f172a" />
    <rect x="6" y="5" width="92" height="28" rx="5" fill="#0284c7" />
    <text x="52.0" y="24" class="font-mono" font-size="15px" font-weight="700" text-anchor="middle" fill="#ffffff">PUZZLE</text>
    <text x="106" y="25" class="font-mono" font-size="16.5px" font-weight="700" fill="#ffffff">STACK ALL 28 PRIMES IN 12 STACKS?</text>

    <!-- Left Illustrated Block Diagram (198 x 208) -->
    <g transform="translate(8, 44)">
      <rect x="0" y="0" width="198" height="208" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
      <svg x="4" y="4" width="190" height="200" viewBox="0 0 190 165" preserveAspectRatio="xMidYMid meet">
        
      <text x="95" y="15" class="font-mono" font-size="11.5px" font-weight="700" text-anchor="middle" fill="#0f172a">4 TRIPLES + 8 PAIRS</text>
      <line x1="10" y1="22" x2="180" y2="22" stroke="#0f172a" stroke-width="1.4" stroke-dasharray="3,2" />
      <!-- Col 1: 19, 19, 11 -->
      <rect x="12" y="26" width="38" height="38" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
      <text x="31" y="50" class="font-mono" font-size="13px" font-weight="700" text-anchor="middle" fill="#0f172a">19</text>
      <rect x="12" y="64" width="38" height="38" rx="2" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.2" />
      <text x="31" y="88" class="font-mono" font-size="13px" font-weight="700" text-anchor="middle" fill="#0f172a">19</text>
      <rect x="12" y="102" width="38" height="32" rx="2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2" />
      <text x="31" y="123" class="font-mono" font-size="13px" font-weight="700" text-anchor="middle" fill="#0f172a">11</text>
      <!-- Col 2: 23, 13, 13 -->
      <rect x="54" y="27" width="38" height="41" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
      <text x="73" y="52" class="font-mono" font-size="13px" font-weight="700" text-anchor="middle" fill="#0f172a">23</text>
      <rect x="54" y="68" width="38" height="33" rx="2" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.2" />
      <text x="73" y="89" class="font-mono" font-size="13px" font-weight="700" text-anchor="middle" fill="#0f172a">13</text>
      <rect x="54" y="101" width="38" height="33" rx="2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2" />
      <text x="73" y="122" class="font-mono" font-size="13px" font-weight="700" text-anchor="middle" fill="#0f172a">13</text>
      <!-- Col 3: 97, 29 -->
      <rect x="96" y="31" width="38" height="59" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
      <text x="115" y="65" class="font-mono" font-size="13px" font-weight="700" text-anchor="middle" fill="#0f172a">97</text>
      <rect x="96" y="90" width="38" height="44" rx="2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2" />
      <text x="115" y="117" class="font-mono" font-size="13px" font-weight="700" text-anchor="middle" fill="#0f172a">29</text>
      <!-- Col 4: 61, 59 -->
      <rect x="138" y="28" width="38" height="53" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
      <text x="157" y="59" class="font-mono" font-size="13px" font-weight="700" text-anchor="middle" fill="#0f172a">61</text>
      <rect x="138" y="81" width="38" height="53" rx="2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2" />
      <text x="157" y="112" class="font-mono" font-size="13px" font-weight="700" text-anchor="middle" fill="#0f172a">59</text>
      <line x1="10" y1="134" x2="180" y2="134" stroke="#0f172a" stroke-width="2" />
      <text x="31" y="151" class="font-mono" font-size="10.5px" font-weight="700" text-anchor="middle" fill="#0f172a">3971</text>
      <text x="73" y="151" class="font-mono" font-size="10.5px" font-weight="700" text-anchor="middle" fill="#0f172a">3887</text>
      <text x="115" y="151" class="font-mono" font-size="10.5px" font-weight="700" text-anchor="middle" fill="#0f172a">2813</text>
      <text x="157" y="151" class="font-mono" font-size="10.5px" font-weight="700" text-anchor="middle" fill="#0f172a">3599</text>
      </svg>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(214, 44)">
        <rect x="0" y="0" width="317" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
        <circle cx="18" cy="16" r="11" fill="#0f172a" />
        <text x="18" y="21" class="font-mono" font-size="14.5px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="35" y="21" class="font-mono" font-size="16px" font-weight="700" fill="#0f172a">THE 12-STACK PUZZLE</text>
        <text x="12" y="42" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">Group all 28 primes (11–97) into 12</text><text x="12" y="59.5" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">near-full stacks!</text>
      </g>
      <g transform="translate(214, 115)">
        <rect x="0" y="0" width="317" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
        <circle cx="18" cy="16" r="11" fill="#0f172a" />
        <text x="18" y="21" class="font-mono" font-size="14.5px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="35" y="21" class="font-mono" font-size="16px" font-weight="700" fill="#0f172a">PRODUCT ≤ 4,096</text>
        <text x="12" y="42" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">Full stack = 4,096. Keep each</text><text x="12" y="59.5" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">stack's product near 4,096.</text>
      </g>
      <g transform="translate(214, 186)">
        <rect x="0" y="0" width="317" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
        <circle cx="18" cy="16" r="11" fill="#0f172a" />
        <text x="18" y="21" class="font-mono" font-size="14.5px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="35" y="21" class="font-mono" font-size="16px" font-weight="700" fill="#0f172a">TRIPLES &amp; PAIRS</text>
        <text x="12" y="42" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">4 triples (11–23) + 8 outside-in</text><text x="12" y="59.5" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">pairs! Solution below ↓</text>
      </g>
  </g>

  <!-- Bottom Solution & Storage Strip (x=26..1114, y=288..328, w=1088, h=40) -->
  <rect x="26" y="288" width="1088" height="40" rx="7" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4" />
  <rect x="32" y="293" width="214" height="30" rx="5" fill="#0f172a" />
  <text x="139" y="313.5" class="font-mono" font-size="16px" font-weight="700" text-anchor="middle" fill="#ffffff">12-STACK SOLUTION</text>
  <text x="258" y="314" class="font-sans" font-size="15.8px" font-weight="700" fill="#0f172a">4 Triples: 11·13·23 | 13·13·23 | 11·17·17 | 11·19·19  •  8 Pairs: 29·97 | 31·89 | 37·83 | 41·79 | 43·73 | 47·71 | 53·67 | 59·61</text>
</svg>