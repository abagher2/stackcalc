        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">BUILD THE FULL STACK</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Stack [11] + [13] + [23] in socket 3289—only the true prime</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">factors form a full stack!</text>
      </g>

