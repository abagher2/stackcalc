      <rect x="12" y="30" width="37" height="37" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.1" />
      <text x="30.5" y="52" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#0f172a">19</text>
