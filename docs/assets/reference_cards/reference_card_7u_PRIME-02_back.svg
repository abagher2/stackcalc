  <text x="985" y="45" class="font-mono" font-size="11.5px" font-weight="700" text-anchor="middle" fill="#ffffff">12-STACK PUZZLE • PRIME-02</text>

  
  <!-- ACTIVITY 1 PANEL (y=66..294) -->
