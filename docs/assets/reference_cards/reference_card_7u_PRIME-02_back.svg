        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Alternating digit sum: 3 − 2 + 8 − 9 = 0 (divisible by 11!):</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">3289 ÷ 11 = 299 = 13 × 23.</text>
