<svg xmlns="http://www.w3.org/2000/svg" width="114.0mm" height="35.0mm" viewBox="0 0 1140 350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
      .font-mono { font-family: 'Space Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- 114.0 x 35.0 mm Cut Cell Background & Inset Safe Frame -->
  <rect x="0" y="0" width="1140" height="350" fill="#ffffff" />
  <rect x="16" y="14" width="1108" height="322" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />

  <!-- Top Header Strip -->
  <rect x="26" y="20" width="1088" height="38" rx="8" fill="#0f172a" />
  <text x="38" y="36" class="font-mono" font-size="14.5px" font-weight="700" fill="#ffffff">PRIME EXPANSION (11–97) — COMPOSITE &amp; SEMIPRIME PUZZLES</text>
  <text x="38" y="51" class="font-mono" font-size="9.5px" fill="#94a3b8">SIDE B • ILLUSTRATED CLASSROOM EXPLORATIONS &amp; SELF-CHECKING PACK-UP • STACKCALC LABS</text>
  <rect x="866" y="25" width="238" height="28" rx="6" fill="#059669" />
  <text x="985" y="43" class="font-mono" font-size="11.5px" font-weight="700" text-anchor="middle" fill="#ffffff">84mm CHECKSUM • PRIME-02</text>

  
  <!-- ACTIVITY 1 PANEL -->
  <g transform="translate(26, 64)">
    <rect x="0" y="0" width="539" height="228" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="539" height="24" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="6" y="3.5" width="76" height="17" rx="4" fill="#0284c7" />
    <text x="44" y="15" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 1</text>
    <text x="90" y="15.5" class="font-mono" font-size="10.5px" font-weight="700" fill="#0f172a">3-PRIME WATERLINE PUZZLE (3289 = 11·13·23)</text>
    <text x="531" y="15.5" class="font-mono" font-size="9px" font-weight="700" text-anchor="end" fill="#0284c7">COMPOSITE FACTORING</text>

    <!-- Left Illustrated Block Diagram (190 x 162) -->
    <g transform="translate(8, 28)">
      <rect x="0" y="0" width="190" height="161" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
      
      <text x="95" y="14" class="font-mono" font-size="9px" font-weight="700" text-anchor="middle" fill="#0369a1">SOCKET 3289 = 11 × 13 × 23</text>
      <line x1="18" y1="28" x2="172" y2="28" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2" />
      <text x="95" y="24" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#15803d">84.0mm WATERLINE</text>
      <!-- [23] (31.7mm), [13] (25.9mm), [11] (24.2mm) + +2.2mm pedestal -->
      <rect x="48" y="28" width="94" height="38" rx="3" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.3" />
      <text x="95" y="51" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#854d0e">[23] 31.7mm</text>
      <rect x="48" y="66" width="94" height="31" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.3" />
      <text x="95" y="86" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#854d0e">[13] 25.9mm</text>
      <rect x="48" y="97" width="94" height="29" rx="3" fill="#fde047" stroke="#ca8a04" stroke-width="1.3" />
      <text x="95" y="116" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#854d0e">[11] 24.2mm</text>
      <!-- Floor step +2.2mm -->
      <rect x="34" y="126" width="122" height="12" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.2" />
      <text x="95" y="135" class="font-mono" font-size="8px" font-weight="700" text-anchor="middle" fill="#1e293b">STEP +2.2mm • SOCKET 3289</text>
      <text x="95" y="151" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#15803d">11 × 13 × 23 = 3,289 ✓</text>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(202, 28)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0284c7" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">READ SOCKET 3289</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Inspect the 4-digit composite target embossed on the</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">back-left floor socket (3289).</text>
      </g>
      <g transform="translate(202, 83)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0284c7" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">TEST DIVISIBILITY</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">3 − 2 + 8 − 9 = 0 (multiple of 11!): 3289 ÷ 11 = 299,</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">and 299 = 13 × 23.</text>
      </g>
      <g transform="translate(202, 138)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0284c7" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">VERIFY 84mm FLUSH</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Stack [11] + [13] + [23] in socket 3289—with its +2.2mm</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">floor step, it hits 84.0mm!</text>
      </g>

    <!-- Bottom Concept Takeaway Bar -->
    <rect x="8" y="195" width="523" height="26" rx="5" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.0" />
    <text x="14" y="211.5" class="font-sans" font-size="9.2px" font-weight="700" fill="#0369a1">★ KEY CONCEPT: <tspan font-weight="400" fill="#0f172a">Logarithmic heights + stepped floors form a physical checksum: only true factors hit 84.0mm.</tspan></text>
  </g>
  <!-- ACTIVITY 2 PANEL -->
  <g transform="translate(575, 64)">
    <rect x="0" y="0" width="539" height="228" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="539" height="24" rx="8" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1" />
    <rect x="6" y="3.5" width="76" height="17" rx="4" fill="#059669" />
    <text x="44" y="15" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 2</text>
    <text x="90" y="15.5" class="font-mono" font-size="10.5px" font-weight="700" fill="#0f172a">RSA SEMIPRIME LOCK (3599 = 59 × 61)</text>
    <text x="531" y="15.5" class="font-mono" font-size="9px" font-weight="700" text-anchor="end" fill="#059669">CRYPTO TRAPDOOR</text>

    <!-- Left Illustrated Block Diagram (190 x 162) -->
    <g transform="translate(8, 28)">
      <rect x="0" y="0" width="190" height="161" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
      
      <text x="95" y="14" class="font-mono" font-size="9px" font-weight="700" text-anchor="middle" fill="#047857">SEMIPRIME LOCK: 3599 = 59 × 61</text>
      <line x1="18" y1="28" x2="172" y2="28" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2" />
      <text x="95" y="24" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#15803d">84.0mm FLUSH CHECKSUM</text>
      <rect x="44" y="28" width="102" height="49" rx="3" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.3" />
      <text x="95" y="56" class="font-mono" font-size="11.5px" font-weight="700" text-anchor="middle" fill="#854d0e">[61] 41.5mm</text>
      <rect x="44" y="77" width="102" height="49" rx="3" fill="#fde047" stroke="#ca8a04" stroke-width="1.3" />
      <text x="95" y="105" class="font-mono" font-size="11.5px" font-weight="700" text-anchor="middle" fill="#854d0e">[59] 41.2mm</text>
      <rect x="34" y="126" width="122" height="12" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.2" />
      <text x="95" y="135" class="font-mono" font-size="8px" font-weight="700" text-anchor="middle" fill="#1e293b">STEP +1.3mm • SOCKET 3599</text>
      <text x="95" y="151" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#047857">60² − 1² = 59 × 61 = 3,599</text>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(202, 28)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#059669" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">FAST FORWARD LOCK</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Stack twin primes [59] (41.2mm) + [61]</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">(41.5mm)—multiplication is instant (3599).</text>
      </g>
      <g transform="translate(202, 83)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#059669" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">REVERSE CHALLENGE</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Use difference of squares: 3599 = 60² − 1² = (60 − 1)(60</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">+ 1) = 59 × 61!</text>
      </g>
      <g transform="translate(202, 138)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#059669" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">CHECK FLOOR FIT</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Seat [59] + [61] in socket 3599 (+1.3mm step) → exact</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">84.0mm flush lock!</text>
      </g>

    <!-- Bottom Concept Takeaway Bar -->
    <rect x="8" y="195" width="523" height="26" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.0" />
    <text x="14" y="211.5" class="font-sans" font-size="9.2px" font-weight="700" fill="#047857">★ KEY CONCEPT: <tspan font-weight="400" fill="#0f172a">Multiplying two large primes (stacking) is instant; factoring their product is a one-way puzzle.</tspan></text>
  </g>

  <!-- Bottom 10-Second Self-Checking Waterline Pack-Up Strip -->
  <rect x="26" y="298" width="1088" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1" />
  <rect x="30" y="302" width="166" height="20" rx="4" fill="#0f172a" />
  <text x="113" y="315.5" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#38bdf8">10-SEC BOX PACK-UP</text>
  <text x="206" y="316" class="font-sans" font-size="10.5px" font-weight="700" fill="#0f172a">Factor all 12 floor numbers (4× 3-prime triples + 8× 2-prime semiprimes) into their sockets → All 12 level flush at 84.0mm!</text>
</svg>