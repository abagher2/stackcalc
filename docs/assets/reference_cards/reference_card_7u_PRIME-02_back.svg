        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Can you group all 28 prime blocks (11 to 97) into the 12</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">sockets with minimal space left at the top?</text>
