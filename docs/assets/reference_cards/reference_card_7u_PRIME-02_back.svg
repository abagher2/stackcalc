        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Inspect the 4-digit composite target 3,289 (or stage [11],</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">[13], and [23] on the lid).</text>
