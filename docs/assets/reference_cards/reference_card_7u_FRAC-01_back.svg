<svg xmlns="http://www.w3.org/2000/svg" width="114.0mm" height="35.0mm" viewBox="0 0 1140 350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
      .font-mono { font-family: 'Space Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- 114.0 x 35.0 mm Cut Cell Background & Inset Safe Frame -->
  <rect x="0" y="0" width="1140" height="350" fill="#ffffff" />
  <rect x="16" y="14" width="1108" height="322" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />

  <!-- Top Header Strip -->
  <rect x="26" y="20" width="1088" height="38" rx="8" fill="#0f172a" />
  <text x="38" y="36" class="font-mono" font-size="14.5px" font-weight="700" fill="#ffffff">FRACTION TOWER STUDIO — EQUIVALENCE &amp; LOW-JOINT PACKING</text>
  <text x="38" y="51" class="font-mono" font-size="9.5px" fill="#94a3b8">SIDE B • ILLUSTRATED CLASSROOM EXPLORATIONS &amp; SELF-CHECKING PACK-UP • STACKCALC LABS</text>
  <rect x="866" y="25" width="238" height="28" rx="6" fill="#059669" />
  <text x="985" y="43" class="font-mono" font-size="11.5px" font-weight="700" text-anchor="middle" fill="#ffffff">84mm = 1 WHOLE • FRAC-01</text>

  
  <!-- ACTIVITY 1 PANEL -->
  <g transform="translate(26, 64)">
    <rect x="0" y="0" width="539" height="228" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="539" height="24" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="6" y="3.5" width="76" height="17" rx="4" fill="#0284c7" />
    <text x="44" y="15" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 1</text>
    <text x="90" y="15.5" class="font-mono" font-size="10.5px" font-weight="700" fill="#0f172a">UNLIKE FRACTION ADDITION (1/3 + 1/4 = 7/12)</text>
    <text x="531" y="15.5" class="font-mono" font-size="9px" font-weight="700" text-anchor="end" fill="#0284c7">4-WAY NOTATION</text>

    <!-- Left Illustrated Block Diagram (190 x 162) -->
    <g transform="translate(8, 28)">
      <rect x="0" y="0" width="190" height="161" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
      
      <text x="95" y="14" class="font-mono" font-size="9px" font-weight="700" text-anchor="middle" fill="#047857">1/3 (28mm) + 1/4 (21mm) = 7/12</text>
      <line x1="20" y1="38" x2="170" y2="38" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4,2" />
      <text x="95" y="32" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#15803d">49.0mm COMMON HEIGHT</text>
      <!-- Left Tower: [1/4] (42px) on top of [1/3] (56px) -> total 98px (y=38..136) -->
      <rect x="30" y="38" width="52" height="42" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3" />
      <text x="56" y="63" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#1e40af">1/4 (21)</text>
      <rect x="30" y="80" width="52" height="56" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3" />
      <text x="56" y="112" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#991b1b">1/3 (28)</text>
      <!-- Right Tower: 7x [1/12] (each 14px -> 98px total, y=38..136) -->
      <rect x="108" y="38" width="52" height="98" rx="3" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.3" />
      <line x1="108" y1="52" x2="160" y2="52" stroke="#1d4ed8" stroke-width="1" />
      <line x1="108" y1="66" x2="160" y2="66" stroke="#1d4ed8" stroke-width="1" />
      <line x1="108" y1="80" x2="160" y2="80" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2" />
      <line x1="108" y1="94" x2="160" y2="94" stroke="#1d4ed8" stroke-width="1" />
      <line x1="108" y1="108" x2="160" y2="108" stroke="#1d4ed8" stroke-width="1" />
      <line x1="108" y1="122" x2="160" y2="122" stroke="#1d4ed8" stroke-width="1" />
      <text x="134" y="63" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#1e3a8a">3×1/12</text>
      <text x="134" y="112" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#1e3a8a">4×1/12</text>
      <line x1="16" y1="136" x2="174" y2="136" stroke="#0f172a" stroke-width="2" />
      <text x="95" y="151" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#047857">4/12 + 3/12 = 7/12 (49mm)</text>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(202, 28)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0284c7" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">STACK 1/3 + 1/4</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Place [1/4] (21mm) on [1/3] (28mm) on the Lid (49.0mm).</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">Rotate 90° for Decimal, %, or °!</text>
      </g>
      <g transform="translate(202, 83)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0284c7" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">FIND SHARED UNIT</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Sixths (42mm / 56mm) miss 49mm, but 7×[1/12] (7 × 7.0mm</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">= 49.0mm) stands dead-flush!</text>
      </g>
      <g transform="translate(202, 138)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0284c7" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">REDUCE TO FEWEST</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">When a sum matches a larger block (e.g. 3×[1/6] = 42mm),</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">trade for 1×[1/2] (42mm).</text>
      </g>

    <!-- Bottom Concept Takeaway Bar -->
    <rect x="8" y="195" width="523" height="26" rx="5" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.0" />
    <text x="14" y="211.5" class="font-sans" font-size="9.2px" font-weight="700" fill="#0369a1">★ KEY CONCEPT: <tspan font-weight="400" fill="#0f172a">Common denominator 1/12 (7mm) is a shared unit size measuring both 1/3 (28mm) and 1/4 (21mm).</tspan></text>
  </g>
  <!-- ACTIVITY 2 PANEL -->
  <g transform="translate(575, 64)">
    <rect x="0" y="0" width="539" height="228" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="539" height="24" rx="8" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1" />
    <rect x="6" y="3.5" width="76" height="17" rx="4" fill="#059669" />
    <text x="44" y="15" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 2</text>
    <text x="90" y="15.5" class="font-mono" font-size="10.5px" font-weight="700" fill="#0f172a">MINIMAL-BLOCK COLUMN STACKING (= 1 WHOLE)</text>
    <text x="531" y="15.5" class="font-mono" font-size="9px" font-weight="700" text-anchor="end" fill="#059669">MAX 6–7 BLKS/COL</text>

    <!-- Left Illustrated Block Diagram (190 x 162) -->
    <g transform="translate(8, 28)">
      <rect x="0" y="0" width="190" height="161" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
      
      <text x="95" y="13" class="font-mono" font-size="8.8px" font-weight="700" text-anchor="middle" fill="#047857">84.0mm = 1 WHOLE (MAX 6–7 BLKS)</text>
      <line x1="10" y1="26" x2="180" y2="26" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2" />
      <!-- Col 1 (x=12..48, w=36): 5x[1/10] (y=26..81, h=55) + 1x[1/2] (y=81..136, h=55) -->
      <rect x="12" y="26" width="36" height="55" rx="2" fill="#f8fafc" stroke="#475569" stroke-width="1.1" />
      <line x1="12" y1="37" x2="48" y2="37" stroke="#94a3b8" stroke-width="0.8" />
      <line x1="12" y1="48" x2="48" y2="48" stroke="#94a3b8" stroke-width="0.8" />
      <line x1="12" y1="59" x2="48" y2="59" stroke="#94a3b8" stroke-width="0.8" />
      <line x1="12" y1="70" x2="48" y2="70" stroke="#94a3b8" stroke-width="0.8" />
      <text x="30" y="57" class="font-mono" font-size="8px" font-weight="700" text-anchor="middle" fill="#0f172a">5×1/10</text>
      <rect x="12" y="81" width="36" height="55" rx="2" fill="#fde68a" stroke="#b45309" stroke-width="1.2" />
      <text x="30" y="112" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#92400e">1/2</text>
      <!-- Col 2 (x=54..90, w=36): 4x[1/8] (y=26..81, h=55) + 2x[1/4] (y=81..136, h=55) -->
      <rect x="54" y="26" width="36" height="55" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.1" />
      <line x1="54" y1="39.75" x2="90" y2="39.75" stroke="#60a5fa" stroke-width="0.8" />
      <line x1="54" y1="53.5" x2="90" y2="53.5" stroke="#60a5fa" stroke-width="0.8" />
      <line x1="54" y1="67.25" x2="90" y2="67.25" stroke="#60a5fa" stroke-width="0.8" />
      <text x="72" y="57" class="font-mono" font-size="8px" font-weight="700" text-anchor="middle" fill="#1e3a8a">4×1/8</text>
      <rect x="54" y="81" width="36" height="27.5" rx="2" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.2" />
      <text x="72" y="98" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#1e3a8a">1/4</text>
      <rect x="54" y="108.5" width="36" height="27.5" rx="2" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.2" />
      <text x="72" y="125.5" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#1e3a8a">1/4</text>
      <!-- Col 3 (x=96..134, w=38): 3x[1/9] (y=26..62.6, h=36.6) + 2x[1/6] (y=62.6..99.3, h=36.7) + 1x[1/3] (y=99.3..136, h=36.7) -->
      <rect x="96" y="26" width="38" height="36.6" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.1" />
      <line x1="96" y1="38.2" x2="134" y2="38.2" stroke="#f87171" stroke-width="0.8" />
      <line x1="96" y1="50.4" x2="134" y2="50.4" stroke="#f87171" stroke-width="0.8" />
      <text x="115" y="47.5" class="font-mono" font-size="8px" font-weight="700" text-anchor="middle" fill="#991b1b">3×1/9</text>
      <rect x="96" y="62.6" width="38" height="36.7" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1.1" />
      <line x1="96" y1="81.0" x2="134" y2="81.0" stroke="#dc2626" stroke-width="0.9" />
      <text x="115" y="84" class="font-mono" font-size="8px" font-weight="700" text-anchor="middle" fill="#991b1b">2×1/6</text>
      <rect x="96" y="99.3" width="38" height="36.7" rx="2" fill="#fca5a5" stroke="#dc2626" stroke-width="1.2" />
      <text x="115" y="121" class="font-mono" font-size="9px" font-weight="700" text-anchor="middle" fill="#7f1d1d">1/3</text>
      <!-- Col 4 (x=140..178, w=38): 6x[1/12] (y=26..81, h=55) + 1x[1/2] (y=81..136, h=55) -->
      <rect x="140" y="26" width="38" height="55" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.1" />
      <line x1="140" y1="35.2" x2="178" y2="35.2" stroke="#60a5fa" stroke-width="0.8" />
      <line x1="140" y1="44.3" x2="178" y2="44.3" stroke="#60a5fa" stroke-width="0.8" />
      <line x1="140" y1="53.5" x2="178" y2="53.5" stroke="#60a5fa" stroke-width="0.8" />
      <line x1="140" y1="62.7" x2="178" y2="62.7" stroke="#60a5fa" stroke-width="0.8" />
      <line x1="140" y1="71.8" x2="178" y2="71.8" stroke="#60a5fa" stroke-width="0.8" />
      <text x="159" y="57" class="font-mono" font-size="8px" font-weight="700" text-anchor="middle" fill="#1e3a8a">6×1/12</text>
      <rect x="140" y="81" width="38" height="55" rx="2" fill="#fde68a" stroke="#b45309" stroke-width="1.2" />
      <text x="159" y="112" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#92400e">1/2</text>
      <line x1="10" y1="136" x2="180" y2="136" stroke="#0f172a" stroke-width="2" />
      <text x="30" y="147" class="font-mono" font-size="7.8px" font-weight="700" text-anchor="middle" fill="#334155">2 COLS</text>
      <text x="72" y="147" class="font-mono" font-size="7.8px" font-weight="700" text-anchor="middle" fill="#334155">2 COLS</text>
      <text x="115" y="147" class="font-mono" font-size="7.8px" font-weight="700" text-anchor="middle" fill="#334155">3 COLS</text>
      <text x="159" y="147" class="font-mono" font-size="7.8px" font-weight="700" text-anchor="middle" fill="#334155">2 COLS</text>
      <text x="95" y="157.5" class="font-mono" font-size="7.8px" font-weight="700" text-anchor="middle" fill="#047857">+ 2×[1] + [5/5] = 12 WHOLES</text>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(202, 28)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#059669" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">1/2 PEDESTALS (4 COLS)</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Don't stack 10×1/10 or 12×1/12! Put 1×[1/2] under</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">5×[1/10] (2 cols) &amp; under 6×[1/12] (2 cols).</text>
      </g>
      <g transform="translate(202, 83)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#059669" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">1/4 + 1/8 COLS (2 COLS)</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Stack 2×[1/4] (42mm) + 4×[1/8] (42mm) = 1 Whole in 2</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">columns (only 6 blocks/col!).</text>
      </g>
      <g transform="translate(202, 138)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#059669" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">THIRDS FAMILY (3 COLS)</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Stack 1×[1/3] + 2×[1/6] + 3×[1/9] = 1 in 3 cols (6</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">blks/col), plus 5×[1/5] &amp; 2 cols of [1].</text>
      </g>

    <!-- Bottom Concept Takeaway Bar -->
    <rect x="8" y="195" width="523" height="26" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.0" />
    <text x="14" y="211.5" class="font-sans" font-size="9.2px" font-weight="700" fill="#047857">★ KEY CONCEPT: <tspan font-weight="400" fill="#0f172a">Using larger fractions as 42mm/56mm bases caps every 84mm column at 6–7 blocks while proving = 1!</tspan></text>
  </g>

  <!-- Bottom 10-Second Self-Checking Waterline Pack-Up Strip -->
  <rect x="26" y="298" width="1088" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1" />
  <rect x="30" y="302" width="166" height="20" rx="4" fill="#0f172a" />
  <text x="113" y="315.5" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#38bdf8">10-SEC BOX PACK-UP</text>
  <text x="206" y="316" class="font-sans" font-size="10.5px" font-weight="700" fill="#0f172a">12 Full 84mm Columns: 2×[1] | 1×[5/5] | 2×[1/2 + 5/10] | 2×[2/4 + 4/8] | 3×[1/3 + 2/6 + 3/9] | 2×[1/2 + 6/12] → Max 6–7 blks/col!</text>
</svg>