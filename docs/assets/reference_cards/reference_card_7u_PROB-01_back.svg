<svg xmlns="http://www.w3.org/2000/svg" width="114.0mm" height="35.0mm" viewBox="0 0 1140 350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
      .font-mono { font-family: 'Space Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- 114.0 x 35.0 mm Cut Cell Background (2.6mm L/R & 2.2mm T/B symmetric white safe margin) -->
  <rect x="0" y="0" width="1140" height="350" fill="#ffffff" />

  
  <!-- ACTIVITY 1 PANEL (x=26..565, y=22..282) -->
  <g transform="translate(26, 22)">
    <rect x="0" y="0" width="539" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" />
    <rect x="0" y="0" width="539" height="38" rx="8" fill="#0f172a" />
    <rect x="6" y="5" width="118" height="28" rx="5" fill="#0284c7" />
    <text x="65.0" y="24" class="font-mono" font-size="15px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 1</text>
    <text x="132" y="25" class="font-mono" font-size="17.5px" font-weight="700" fill="#ffffff">2D6 SUM HISTOGRAM (WHY 7 WINS)</text>

    <!-- Left Illustrated Block Diagram (198 x 208) -->
    <g transform="translate(8, 44)">
      <rect x="0" y="0" width="198" height="208" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
      <svg x="4" y="4" width="190" height="200" viewBox="0 0 190 165" preserveAspectRatio="xMidYMid meet">
        
      <rect x="14" y="18" width="162" height="114" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.4" />
      <rect x="22" y="28" width="68" height="44" rx="4" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.3" />
      <text x="56" y="55" class="font-mono" font-size="13.5px" font-weight="700" text-anchor="middle" fill="#0f172a">PART A</text>
      <rect x="100" y="28" width="68" height="44" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.3" />
      <text x="134" y="55" class="font-mono" font-size="13.5px" font-weight="700" text-anchor="middle" fill="#0f172a">PART B</text>
      <rect x="22" y="80" width="146" height="40" rx="4" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.3" />
      <text x="95" y="105" class="font-mono" font-size="13.5px" font-weight="700" text-anchor="middle" fill="#0f172a">EQUAL HEIGHT</text>
      <text x="95" y="152" class="font-mono" font-size="11.5px" font-weight="700" text-anchor="middle" fill="#0f172a">COMPARISON STAGE</text>
      </svg>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(214, 44)">
        <rect x="0" y="0" width="317" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
        <circle cx="18" cy="16" r="11" fill="#0f172a" />
        <text x="18" y="21" class="font-mono" font-size="14.5px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="35" y="21" class="font-mono" font-size="16px" font-weight="700" fill="#0f172a">ROLL 2D6 &amp; TALLY</text>
        <text x="12" y="42" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">Roll two dice 30 times; stack a</text><text x="12" y="59.5" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">token in Socket 2–12.</text>
      </g>
      <g transform="translate(214, 115)">
        <rect x="0" y="0" width="317" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
        <circle cx="18" cy="16" r="11" fill="#0f172a" />
        <text x="18" y="21" class="font-mono" font-size="14.5px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="35" y="21" class="font-mono" font-size="16px" font-weight="700" fill="#0f172a">TOWER 7 PEAKS</text>
        <text x="12" y="42" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">Sum 7 has 6 ways (6/36 = 16.7%); 2 &amp;</text><text x="12" y="59.5" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">12 have only 1/36!</text>
      </g>
      <g transform="translate(214, 186)">
        <rect x="0" y="0" width="317" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
        <circle cx="18" cy="16" r="11" fill="#0f172a" />
        <text x="18" y="21" class="font-mono" font-size="14.5px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="35" y="21" class="font-mono" font-size="16px" font-weight="700" fill="#0f172a">BELL PYRAMID</text>
        <text x="12" y="42" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">Token towers form a binomial</text><text x="12" y="59.5" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">distribution peaking at 7.</text>
      </g>
  </g>
  <!-- ACTIVITY 2 PANEL (x=575..1114, y=22..282) -->
  <g transform="translate(575, 22)">
    <rect x="0" y="0" width="539" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" />
    <rect x="0" y="0" width="539" height="38" rx="8" fill="#0f172a" />
    <rect x="6" y="5" width="118" height="28" rx="5" fill="#0284c7" />
    <text x="65.0" y="24" class="font-mono" font-size="15px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 2</text>
    <text x="132" y="25" class="font-mono" font-size="16.5px" font-weight="700" fill="#ffffff">SPINNER SECTORS (1/2 + 1/3 + 1/6)</text>

    <!-- Left Illustrated Block Diagram (198 x 208) -->
    <g transform="translate(8, 44)">
      <rect x="0" y="0" width="198" height="208" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
      <svg x="4" y="4" width="190" height="200" viewBox="0 0 190 165" preserveAspectRatio="xMidYMid meet">
        
      <rect x="14" y="18" width="162" height="114" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.4" />
      <rect x="22" y="28" width="68" height="44" rx="4" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.3" />
      <text x="56" y="55" class="font-mono" font-size="13.5px" font-weight="700" text-anchor="middle" fill="#0f172a">PART A</text>
      <rect x="100" y="28" width="68" height="44" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.3" />
      <text x="134" y="55" class="font-mono" font-size="13.5px" font-weight="700" text-anchor="middle" fill="#0f172a">PART B</text>
      <rect x="22" y="80" width="146" height="40" rx="4" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.3" />
      <text x="95" y="105" class="font-mono" font-size="13.5px" font-weight="700" text-anchor="middle" fill="#0f172a">EQUAL HEIGHT</text>
      <text x="95" y="152" class="font-mono" font-size="11.5px" font-weight="700" text-anchor="middle" fill="#0f172a">COMPARISON STAGE</text>
      </svg>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(214, 44)">
        <rect x="0" y="0" width="317" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
        <circle cx="18" cy="16" r="11" fill="#0f172a" />
        <text x="18" y="21" class="font-mono" font-size="14.5px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="35" y="21" class="font-mono" font-size="16px" font-weight="700" fill="#0f172a">SNAP SECTORS</text>
        <text x="12" y="42" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">Fit 180° (1/2), 120° (1/3), and 60°</text><text x="12" y="59.5" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">(1/6) rings on dial.</text>
      </g>
      <g transform="translate(214, 115)">
        <rect x="0" y="0" width="317" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
        <circle cx="18" cy="16" r="11" fill="#0f172a" />
        <text x="18" y="21" class="font-mono" font-size="14.5px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="35" y="21" class="font-mono" font-size="16px" font-weight="700" fill="#0f172a">PREDICT 12 SPINS</text>
        <text x="12" y="42" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">Expect ~6 landings on 1/2, ~4 on</text><text x="12" y="59.5" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">1/3, and ~2 on 1/6.</text>
      </g>
      <g transform="translate(214, 186)">
        <rect x="0" y="0" width="317" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
        <circle cx="18" cy="16" r="11" fill="#0f172a" />
        <text x="18" y="21" class="font-mono" font-size="14.5px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="35" y="21" class="font-mono" font-size="16px" font-weight="700" fill="#0f172a">SPIN &amp; VERIFY</text>
        <text x="12" y="42" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">Spin 12 times and stack tokens to</text><text x="12" y="59.5" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">compare with theory!</text>
      </g>
  </g>

  <!-- Bottom Solution & Storage Strip (x=26..1114, y=288..328, w=1088, h=40) -->
  <rect x="26" y="288" width="1088" height="40" rx="7" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4" />
  <rect x="32" y="293" width="214" height="30" rx="5" fill="#0f172a" />
  <text x="139" y="313.5" class="font-mono" font-size="16px" font-weight="700" text-anchor="middle" fill="#ffffff">QUICK CLEANUP</text>
  <text x="258" y="314" class="font-sans" font-size="15.8px" font-weight="700" fill="#0f172a">Store polyhedral dice, spinner base, and tally tokens inside the base and snap the histogram lid shut!</text>
</svg>