<svg xmlns="http://www.w3.org/2000/svg" width="114.0mm" height="35.0mm" viewBox="0 0 1140 350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
      .font-mono { font-family: 'Space Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- 114.0 x 35.0 mm Cut Cell Background & Inset Safe Frame -->
  <rect x="0" y="0" width="1140" height="350" fill="#ffffff" />
  <rect x="16" y="14" width="1108" height="322" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />

  <!-- Top Header Strip -->
  <rect x="26" y="20" width="1088" height="38" rx="8" fill="#0f172a" />
  <text x="38" y="36" class="font-mono" font-size="14.5px" font-weight="700" fill="#ffffff">PROBABILITY STUDIO — 2D6 HISTOGRAMS &amp; SPINNER SECTORS</text>
  <text x="38" y="51" class="font-mono" font-size="9.5px" fill="#94a3b8">SIDE B • ILLUSTRATED CLASSROOM EXPLORATIONS &amp; SELF-CHECKING PACK-UP • STACKCALC LABS</text>
  <rect x="866" y="25" width="238" height="28" rx="6" fill="#059669" />
  <text x="985" y="43" class="font-mono" font-size="11.5px" font-weight="700" text-anchor="middle" fill="#ffffff">SAMPLE SPACE • PROB-01</text>

  
  <!-- ACTIVITY 1 PANEL -->
  <g transform="translate(26, 64)">
    <rect x="0" y="0" width="539" height="228" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="539" height="24" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="6" y="3.5" width="76" height="17" rx="4" fill="#0284c7" />
    <text x="44" y="15" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 1</text>
    <text x="90" y="15.5" class="font-mono" font-size="10.5px" font-weight="700" fill="#0f172a">2D6 SUM DISTRIBUTION (WHY 7 WINS)</text>
    <text x="531" y="15.5" class="font-mono" font-size="9px" font-weight="700" text-anchor="end" fill="#0284c7">SAMPLE SPACE (36)</text>

    <!-- Left Illustrated Block Diagram (190 x 162) -->
    <g transform="translate(8, 28)">
      <rect x="0" y="0" width="190" height="161" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
      
      <rect x="14" y="20" width="162" height="112" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" />
      <rect x="24" y="32" width="66" height="42" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3" />
      <text x="57" y="57" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#1e3a8a">PART A</text>
      <rect x="100" y="32" width="66" height="42" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" />
      <text x="133" y="57" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#92400e">PART B</text>
      <rect x="24" y="82" width="142" height="38" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.3" />
      <text x="95" y="105" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#166534">VERIFIED EQUIVALENCE</text>
      <text x="95" y="148" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#475569">STAGE ON 12-SOCKET LID</text>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(202, 28)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0284c7" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">ROLL 2D6 &amp; TALLY</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Roll two 6-sided dice 30 times; stack a tally token in</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">Lid Socket [2]–[12] for each sum.</text>
      </g>
      <g transform="translate(202, 83)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0284c7" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">WATCH TOWER 7 GROW</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Sum = 7 has 6 combinations ((1,6)..(6,1)) = 6/36</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">(16.7%), while 2 and 12 have only 1/36!</text>
      </g>
      <g transform="translate(202, 138)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0284c7" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">COMPARE TO THEORY</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Your physical token towers naturally form a bell-shaped</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">binomial pyramid peaking at 7.</text>
      </g>

    <!-- Bottom Concept Takeaway Bar -->
    <rect x="8" y="195" width="523" height="26" rx="5" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.0" />
    <text x="14" y="211.5" class="font-sans" font-size="9.2px" font-weight="700" fill="#0369a1">★ KEY CONCEPT: <tspan font-weight="400" fill="#0f172a">Physical token stacks turn abstract sample-space probabilities into a visible frequency histogram.</tspan></text>
  </g>
  <!-- ACTIVITY 2 PANEL -->
  <g transform="translate(575, 64)">
    <rect x="0" y="0" width="539" height="228" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="539" height="24" rx="8" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1" />
    <rect x="6" y="3.5" width="76" height="17" rx="4" fill="#059669" />
    <text x="44" y="15" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 2</text>
    <text x="90" y="15.5" class="font-mono" font-size="10.5px" font-weight="700" fill="#0f172a">WEIGHTED SPINNER SECTORS (1/2 + 1/3 + 1/6)</text>
    <text x="531" y="15.5" class="font-mono" font-size="9px" font-weight="700" text-anchor="end" fill="#059669">GEOMETRIC PROBABILITY</text>

    <!-- Left Illustrated Block Diagram (190 x 162) -->
    <g transform="translate(8, 28)">
      <rect x="0" y="0" width="190" height="161" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
      
      <rect x="14" y="20" width="162" height="112" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" />
      <rect x="24" y="32" width="66" height="42" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3" />
      <text x="57" y="57" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#1e3a8a">PART A</text>
      <rect x="100" y="32" width="66" height="42" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" />
      <text x="133" y="57" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#92400e">PART B</text>
      <rect x="24" y="82" width="142" height="38" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.3" />
      <text x="95" y="105" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#166534">VERIFIED EQUIVALENCE</text>
      <text x="95" y="148" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#475569">STAGE ON 12-SOCKET LID</text>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(202, 28)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#059669" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">SNAP SECTOR RINGS</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Fit a 180° (1/2), 120° (1/3), and 60° (1/6) sector ring</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">onto the modular spinner dial.</text>
      </g>
      <g transform="translate(202, 83)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#059669" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">PREDICT 12 SPINS</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Multiply 12 spins by each angle fraction: expect ~6</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">landings on 1/2, ~4 on 1/3, ~2 on 1/6.</text>
      </g>
      <g transform="translate(202, 138)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#059669" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">SPIN &amp; VERIFY</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Run 12 spins and stack tokens to see experimental</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">results converge toward the sector areas!</text>
      </g>

    <!-- Bottom Concept Takeaway Bar -->
    <rect x="8" y="195" width="523" height="26" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.0" />
    <text x="14" y="211.5" class="font-sans" font-size="9.2px" font-weight="700" fill="#047857">★ KEY CONCEPT: <tspan font-weight="400" fill="#0f172a">Sector angle divided by 360° directly determines theoretical probability on a continuous dial.</tspan></text>
  </g>

  <!-- Bottom 10-Second Self-Checking Waterline Pack-Up Strip -->
  <rect x="26" y="298" width="1088" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1" />
  <rect x="30" y="302" width="166" height="20" rx="4" fill="#0f172a" />
  <text x="113" y="315.5" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#38bdf8">10-SEC BOX PACK-UP</text>
  <text x="206" y="316" class="font-sans" font-size="10.5px" font-weight="700" fill="#0f172a">Store polyhedral dice, spinner base, and tally tokens inside the 3×1×7U box and snap the histogram lid shut!</text>
</svg>