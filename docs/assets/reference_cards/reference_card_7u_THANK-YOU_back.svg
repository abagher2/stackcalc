        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">All StackCalc kits share the same interlocking block</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">footprint, so blocks from different kits work together.</text>
