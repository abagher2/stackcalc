      <text x="15" y="22" class="font-mono th" fill="#cccccc">CALIFORNIA LAB INSPECTION PASS</text>
      <text x="15" y="42" class="font-mono td" font-size="10px">Inspector Stamp: <tspan fill="#ffffff" font-weight="700">[ QC-CALIF-01 PASSED ]</tspan></text>
      <text x="15" y="60" class="font-mono td" font-size="10px">Dimensional Datum: <tspan fill="#cccccc">±0.05 mm Mitutoyo Calibrated</tspan></text>
    </g>
