  <g transform="translate(750, 470)">
    <rect x="0" y="0" width="415" height="155" rx="8" fill="#000000" stroke="#ffffff" stroke-width="1.2" />
    <rect x="0" y="0" width="415" height="28" rx="8" fill="#000000" stroke="#ffffff" stroke-width="1" />
    <text x="15" y="18" class="font-mono th" fill="#ffffff">PEDAGOGICAL DESIGN INTEGRITY NOTICE</text>
    
    <text x="18" y="36" class="font-mono td" font-size="10.5px" fill="#ffffff">
      <tspan x="18" dy="17">Zero-Backlash Radial Cursor: Cursor arm glides</tspan>
      <tspan x="18" dy="17">smoothly across the radian track. If needed, rinse</tspan>
      <tspan x="18" dy="17">with cool water to maintain frictionless rotation.</tspan>
    </text>
  </g>

  <g transform="translate(35, 640)">
    <rect x="0" y="0" width="1190" height="110" rx="8" fill="#000000" stroke="#ffffff" stroke-width="1" />
    
    <g transform="translate(25, 25)">
