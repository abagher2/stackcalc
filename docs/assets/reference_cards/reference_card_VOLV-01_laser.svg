    <rect x="12" y="14" width="41" height="6" rx="2" fill="#ffffff" />
    <rect x="16" y="24" width="33" height="6" rx="2" fill="#ffffff" opacity="0.85" />
    <rect x="20" y="34" width="25" height="6" rx="2" fill="#ffffff" opacity="0.70" />
    <rect x="24" y="44" width="17" height="6" rx="2" fill="#ffffff" opacity="0.55" />
  </g>

