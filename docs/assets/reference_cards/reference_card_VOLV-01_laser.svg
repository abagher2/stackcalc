    <text x="25" y="108" class="font-mono td" font-weight="700" text-anchor="middle" font-size="10px">2</text>
    <text x="50" y="108" class="font-mono td">Polar Coordinate Rotor (Radians &amp; π)</text>
    <text x="320" y="108" class="font-mono td" font-weight="700">1x</text>
    <text x="375" y="108" class="font-mono td" fill="#cccccc">Silk Gold PLA</text>
    <text x="525" y="108" class="font-mono td-id">VOLV-VOLV-a1782c9</text>
    <text x="680" y="108" class="font-mono td-price">$6.50</text>
    <line x1="15" y1="116" x2="685" y2="116" stroke="#ffffff" stroke-width="0.7" stroke-dasharray="2,2" />

