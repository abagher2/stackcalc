      <polyline points="3,8 7,12 13,4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <text x="26" y="12" class="font-mono qc-item" font-size="10.5px">Exact radical coordinate fractions readable under ambient light</text>
