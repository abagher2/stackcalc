      <text x="0" y="18" class="font-mono footer-txt">Designed &amp; Manufactured in Mountain View, California, USA.</text>
      <text x="0" y="32" class="font-mono footer-txt">100% Lead-Free, BPA-Free, Non-Toxic High-Impact Thermoplastic PLA/PETG.</text>
    </g>

    <g transform="translate(480, 25)">
      <text x="0" y="0" class="font-mono th" fill="#ffffff">ARCHIVAL COMPANION REFERENCE</text>
      <text x="0" y="18" class="font-mono footer-txt">This card serves as your official kit manifest &amp; warranty registration.</text>
      <text x="0" y="32" class="font-mono footer-txt">SIDE A: REPLACEMENT MANIFEST &amp; CAD SCHEMATIC | MONOCHROME WHITE LASER ABLATION</text>
    </g>

    <g transform="translate(930, 25)">
