<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 820" width="1260" height="820">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
      .font-mono { font-family: 'Space Mono', monospace; }
      .title { font-size: 26px; font-weight: 700; fill: #ffffff; letter-spacing: -0.5px; }
      .subtitle { font-size: 14px; font-weight: 400; fill: #e2e8f0; }
      .badge-sku { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .badge-rev { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .badge-box { font-size: 12px; font-weight: 400; fill: #cccccc; }
      .section-hdr { font-size: 13px; font-weight: 700; fill: #ffffff; letter-spacing: 1px; text-transform: uppercase; }
      .th { font-size: 11px; font-weight: 700; fill: #cccccc; text-transform: uppercase; }
      .td { font-size: 11px; font-weight: 400; fill: #ffffff; }
      .td-id { font-size: 10px; font-weight: 700; fill: #ffffff; }
      .td-price { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: end; }
      .qc-item { font-size: 11px; font-weight: 400; fill: #ffffff; }
      .footer-txt { font-size: 10px; font-weight: 400; fill: #cccccc; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect x="0" y="0" width="1260" height="820" fill="#000000" />

  <!-- Outer Card Frame (135x90mm Proportions) -->
  <rect x="15" y="15" width="1230" height="790" rx="14" fill="#000000" stroke="#ffffff" stroke-width="1.8" />
  <rect x="25" y="25" width="1210" height="770" rx="8" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />

