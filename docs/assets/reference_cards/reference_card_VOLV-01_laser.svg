    <text x="25" y="80" class="font-mono td" font-weight="700" text-anchor="middle" font-size="10px">1</text>
    <text x="50" y="80" class="font-mono td">Stator Base Plate (0°-360° Special Angles)</text>
    <text x="320" y="80" class="font-mono td" font-weight="700">1x</text>
    <text x="375" y="80" class="font-mono td" fill="#cccccc">Matte Black PLA</text>
