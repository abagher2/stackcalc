<svg xmlns="http://www.w3.org/2000/svg" width="114.0mm" height="35.0mm" viewBox="0 0 1140 350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
      .font-mono { font-family: 'Space Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- 114.0 x 35.0 mm Cut Cell Background (2.6mm L/R & 2.2mm T/B symmetric white bleed/safe margin) -->
  <rect x="0" y="0" width="1140" height="350" fill="#ffffff" />

  <!-- Top Header Strip (x=26..1114, y=22..60) -->
  <rect x="26" y="22" width="1088" height="38" rx="8" fill="#0f172a" />
  <text x="38" y="38" class="font-mono" font-size="14.5px" font-weight="700" fill="#ffffff">PRIME FACTOR STUDIO — PRIME TOWERS, GCF &amp; LCM</text>
  <text x="38" y="53" class="font-mono" font-size="9.5px" fill="#94a3b8">HANDS-ON MATHEMATICAL EXPLORATIONS • STACKCALC.IO</text>
  <rect x="866" y="27" width="238" height="28" rx="6" fill="#334155" />
  <text x="985" y="45" class="font-mono" font-size="11.5px" font-weight="700" text-anchor="middle" fill="#ffffff">LOG₂ HEIGHTS • PRIME-01</text>

  
  <!-- ACTIVITY 1 PANEL (y=66..294) -->
  <g transform="translate(26, 66)">
    <rect x="0" y="0" width="539" height="228" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="539" height="24" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <rect x="6" y="3.5" width="76" height="17" rx="4" fill="#0f172a" />
    <text x="44.0" y="15" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 1</text>
    <text x="88" y="15.5" class="font-mono" font-size="10.5px" font-weight="700" fill="#0f172a">UNIQUE PRIME TOWERS (12 = 2 × 2 × 3)</text>

    <!-- Left Illustrated Block Diagram (190 x 161) -->
    <g transform="translate(8, 28)">
      <rect x="0" y="0" width="190" height="161" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
      
      <text x="95" y="13" class="font-mono" font-size="9px" font-weight="700" text-anchor="middle" fill="#0f172a">EQUAL HEIGHT = EQUAL PRODUCT</text>
      <!-- Flush Waterline clearly above y=36 blocks -->
      <text x="69" y="26" class="font-mono" font-size="8.2px" font-weight="700" text-anchor="middle" fill="#334155">FLUSH HEIGHT = 12</text>
      <line x1="14" y1="31" x2="124" y2="31" stroke="#0f172a" stroke-width="1.3" stroke-dasharray="4,2" />
      <!-- Tower 1: [2]+[2]+[3] (y=35..135) -->
      <rect x="20" y="35" width="42" height="44" rx="3" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2" />
      <text x="41" y="61" class="font-mono" font-size="12px" font-weight="700" text-anchor="middle" fill="#0f172a">3</text>
      <rect x="20" y="79" width="42" height="28" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
      <text x="41" y="97" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#0f172a">2</text>
      <rect x="20" y="107" width="42" height="28" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
      <text x="41" y="125" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#0f172a">2</text>
      <!-- Tower 2: [3]+[2]+[2] (y=35..135) -->
      <rect x="76" y="35" width="42" height="28" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
      <text x="97" y="53" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#0f172a">2</text>
      <rect x="76" y="63" width="42" height="28" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
      <text x="97" y="81" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#0f172a">2</text>
      <rect x="76" y="91" width="42" height="44" rx="3" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2" />
      <text x="97" y="117" class="font-mono" font-size="12px" font-weight="700" text-anchor="middle" fill="#0f172a">3</text>
      <!-- Tower 3: [2]+[5] = 10 (y=42..135) -->
      <rect x="134" y="42" width="40" height="65" rx="3" fill="#f1f5f9" stroke="#334155" stroke-width="1.2" />
      <text x="154" y="78" class="font-mono" font-size="12px" font-weight="700" text-anchor="middle" fill="#0f172a">5</text>
      <rect x="134" y="107" width="40" height="28" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.2" />
      <text x="154" y="125" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#0f172a">2</text>
      <!-- Base Stage Line -->
      <line x1="12" y1="135" x2="180" y2="135" stroke="#0f172a" stroke-width="2" />
      <text x="41" y="149" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#0f172a">2·2·3=12</text>
      <text x="97" y="149" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#0f172a">3·2·2=12</text>
      <text x="154" y="149" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#475569">2·5=10≠12</text>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(202, 28)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0f172a" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">STACK 2 × 2 × 3 = 12</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Stack [2] + [2] + [3] on Lid Socket A1—logarithmic block</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">heights add to represent multiplication!</text>
      </g>
      <g transform="translate(202, 83)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0f172a" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">TEST COMMUTATIVITY</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Stack [3] + [2] + [2] on Socket B1. Both towers stand dead-</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">flush at the exact same height!</text>
      </g>
      <g transform="translate(202, 138)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0f172a" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">PROVE UNIQUENESS</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Try [2]+[5] (= 10) or [3]+[5] (= 15)—only the prime factors</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">2·2·3 match the height of 12!</text>
      </g>

    <!-- Bottom Concept Takeaway Bar -->
    <rect x="8" y="195" width="523" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0" />
    <text x="14" y="211.5" class="font-sans" font-size="9.2px" font-weight="700" fill="#0f172a">★ KEY CONCEPT: <tspan font-weight="400" fill="#0f172a">Every composite number has one unique prime recipe; reordering factors never changes stack height.</tspan></text>
  </g>
  <!-- ACTIVITY 2 PANEL (y=66..294) -->
  <g transform="translate(575, 66)">
    <rect x="0" y="0" width="539" height="228" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="539" height="24" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <rect x="6" y="3.5" width="76" height="17" rx="4" fill="#0f172a" />
    <text x="44.0" y="15" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 2</text>
    <text x="88" y="15.5" class="font-mono" font-size="10.5px" font-weight="700" fill="#0f172a">PHYSICAL GCF &amp; LCM (12 VS. 18)</text>

    <!-- Left Illustrated Block Diagram (190 x 161) -->
    <g transform="translate(8, 28)">
      <rect x="0" y="0" width="190" height="161" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
      
      <text x="95" y="14" class="font-mono" font-size="9px" font-weight="700" text-anchor="middle" fill="#0f172a">GCF = SHARED BASE • LCM = UNION</text>
      <!-- Shared GCF Highlight Box with clear margin around y=78..134 -->
      <rect x="15" y="75" width="103" height="60" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.3" stroke-dasharray="3,2" />
      <!-- Tower 12: top [2](49..71), shared [3](78..111) + [2](111..134) -->
      <rect x="20" y="49" width="40" height="22" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
      <text x="40" y="64" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#0f172a">2</text>
      <rect x="20" y="78" width="40" height="33" rx="2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2" />
      <text x="40" y="99" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#0f172a">3</text>
      <rect x="20" y="111" width="40" height="23" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
      <text x="40" y="126" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#0f172a">2</text>
      <!-- Tower 18: top [3](38..71), shared [3](78..111) + [2](111..134) -->
      <rect x="72" y="38" width="40" height="33" rx="2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2" />
      <text x="92" y="59" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#0f172a">3</text>
      <rect x="72" y="78" width="40" height="33" rx="2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2" />
      <text x="92" y="99" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#0f172a">3</text>
      <rect x="72" y="111" width="40" height="23" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
      <text x="92" y="126" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#0f172a">2</text>
      <!-- LCM 36 Tower: [3]+[3]+[2]+[2] (y=22..134) -->
      <rect x="132" y="22" width="42" height="33" rx="2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2" />
      <text x="153" y="42" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#0f172a">3</text>
      <rect x="132" y="55" width="42" height="33" rx="2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2" />
      <text x="153" y="75" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#0f172a">3</text>
      <rect x="132" y="88" width="42" height="23" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
      <text x="153" y="103" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#0f172a">2</text>
      <rect x="132" y="111" width="42" height="23" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
      <text x="153" y="126" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#0f172a">2</text>
      <line x1="12" y1="135" x2="180" y2="135" stroke="#0f172a" stroke-width="2" />
      <text x="66" y="149" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#0f172a">GCF(12,18)=6</text>
      <text x="153" y="149" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#0f172a">LCM=36</text>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(202, 28)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0f172a" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">BUILD 12 AND 18</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Stage Tower 12 ([2]+[3]+[2]) on Socket A1 and Tower 18</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">([2]+[3]+[3]) on Socket B1.</text>
      </g>
      <g transform="translate(202, 83)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0f172a" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">GCF = SHARED BASE</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Compare matching bases: both towers share [2] + [3] = 6.</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">Thus GCF(12, 18) = 6!</text>
      </g>
      <g transform="translate(202, 138)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0f172a" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">LCM = PRIME UNION</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Combine the max count of each prime ([2]+[2]+[3]+[3]) to</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">build LCM(12, 18) = 36!</text>
      </g>

    <!-- Bottom Concept Takeaway Bar -->
    <rect x="8" y="195" width="523" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0" />
    <text x="14" y="211.5" class="font-sans" font-size="9.2px" font-weight="700" fill="#0f172a">★ KEY CONCEPT: <tspan font-weight="400" fill="#0f172a">GCF is the shared base of two prime towers; LCM is their combined prime union.</tspan></text>
  </g>

  <!-- Bottom Solution & Storage Strip (x=26..1114, y=300..328) -->
  <rect x="26" y="300" width="1088" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1" />
  <rect x="30" y="304" width="166" height="20" rx="4" fill="#0f172a" />
  <text x="113" y="317.5" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">FULL-STACK SOLUTION</text>
  <text x="206" y="318" class="font-sans" font-size="10.2px" font-weight="700" fill="#0f172a">Cols 0–1: 6×[2]  •  Front Cols 2–4: 3×[3]  •  Back Cols 2–4: 2×[5]  •  Col 5: 2×[7]  (Stepped floors level all 12 full stacks!)</text>
</svg>