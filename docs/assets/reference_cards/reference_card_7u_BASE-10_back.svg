  <text x="139" y="313.5" class="font-mono" font-size="16px" font-weight="700" text-anchor="middle" fill="#ffffff">FULL-STACK SOLUTION</text>
  <text x="258" y="314" class="font-sans" font-size="15.8px" font-weight="700" fill="#0f172a">Cols 0–4: 4 counters/socket + 2× 5×2 Trays  •  Col 5: 6×[10] blocks/socket → 12 Level Full Stacks!</text>
</svg>