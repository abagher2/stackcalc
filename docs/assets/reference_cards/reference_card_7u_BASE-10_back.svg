        <text x="35" y="21" class="font-mono" font-size="16px" font-weight="700" fill="#0f172a">FILL THE 5-ROW</text>
        <text x="12" y="42" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">Fill top row of a 5×2 Tray with 5</text><text x="12" y="59.5" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">Set A counters.</text>
      </g>
      <g transform="translate(214, 115)">
