        <text x="12" y="42" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">Set 8 counters in Frame A and 5</text><text x="12" y="59.5" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">counters in Frame B.</text>
      </g>
      <g transform="translate(214, 115)">
        <rect x="0" y="0" width="317" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
        <circle cx="18" cy="16" r="11" fill="#0f172a" />
        <text x="18" y="21" class="font-mono" font-size="14.5px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="35" y="21" class="font-mono" font-size="16px" font-weight="700" fill="#0f172a">COMPLETE THE 10</text>
        <text x="12" y="42" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">Move 2 counters from B into A →</text><text x="12" y="59.5" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">Frame A is a full 10!</text>
      </g>
      <g transform="translate(214, 186)">
        <rect x="0" y="0" width="317" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
        <circle cx="18" cy="16" r="11" fill="#0f172a" />
        <text x="18" y="21" class="font-mono" font-size="14.5px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="35" y="21" class="font-mono" font-size="16px" font-weight="700" fill="#0f172a">SWAP FOR [10]</text>
        <text x="12" y="42" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">Trade Frame A for a [10] block + 3</text><text x="12" y="59.5" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">left in B = 13!</text>
      </g>
  </g>

  <!-- Bottom Solution & Storage Strip (x=26..1114, y=288..328, w=1088, h=40) -->
  <rect x="26" y="288" width="1088" height="40" rx="7" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4" />
