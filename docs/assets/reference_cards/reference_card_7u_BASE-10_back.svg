      <rect x="10" y="24" width="170" height="86" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" />
      <rect x="15" y="30" width="28" height="32" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" /><circle cx="29" cy="46" r="7.5" fill="#0f172a" /><rect x="47" y="30" width="28" height="32" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" /><circle cx="61" cy="46" r="7.5" fill="#0f172a" /><rect x="79" y="30" width="28" height="32" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" /><circle cx="93" cy="46" r="7.5" fill="#0f172a" /><rect x="111" y="30" width="28" height="32" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" /><circle cx="125" cy="46" r="7.5" fill="#0f172a" /><rect x="143" y="30" width="28" height="32" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" /><circle cx="157" cy="46" r="7.5" fill="#0f172a" /><rect x="15" y="68" width="28" height="32" rx="4" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.4" /><circle cx="29" cy="84" r="7.5" fill="#475569" /><rect x="47" y="68" width="28" height="32" rx="4" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.4" /><circle cx="61" cy="84" r="7.5" fill="#475569" /><rect x="79" y="68" width="28" height="32" rx="4" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.4" /><circle cx="93" cy="84" r="7.5" fill="#475569" /><rect x="111" y="68" width="28" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3,2" /><rect x="143" y="68" width="28" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3,2" />
      <text x="95" y="131" class="font-mono" font-size="12.5px" font-weight="700" text-anchor="middle" fill="#0f172a">TOP 5 + BOT 3 = 8</text>
      <text x="95" y="152" class="font-mono" font-size="12px" font-weight="700" text-anchor="middle" fill="#334155">10 − 2 = 8</text>
      </svg>
