        <circle cx="18" cy="16" r="11" fill="#0f172a" />
        <text x="18" y="21" class="font-mono" font-size="14.5px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="35" y="21" class="font-mono" font-size="16px" font-weight="700" fill="#0f172a">READ COMPLEMENT</text>
        <text x="12" y="42" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">2 empty slots show 8 + 2 = 10 and 10</text><text x="12" y="59.5" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">− 8 = 2 at a glance.</text>
      </g>
  </g>
  <!-- ACTIVITY 2 PANEL (x=575..1114, y=22..282) -->
  <g transform="translate(575, 22)">
    <rect x="0" y="0" width="539" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" />
    <rect x="0" y="0" width="539" height="38" rx="8" fill="#0f172a" />
    <rect x="6" y="5" width="118" height="28" rx="5" fill="#0284c7" />
    <text x="65.0" y="24" class="font-mono" font-size="15px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 2</text>
    <text x="132" y="25" class="font-mono" font-size="17.5px" font-weight="700" fill="#ffffff">MAKE-A-TEN BRIDGE (8 + 5 = 13)</text>

    <!-- Left Illustrated Block Diagram (198 x 208) -->
    <g transform="translate(8, 44)">
      <rect x="0" y="0" width="198" height="208" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
      <svg x="4" y="4" width="190" height="200" viewBox="0 0 190 165" preserveAspectRatio="xMidYMid meet">
        
      <text x="95" y="16" class="font-mono" font-size="12px" font-weight="700" text-anchor="middle" fill="#0f172a">MAKE 10: 8+5 = 10+3</text>
      <rect x="12" y="26" width="70" height="78" rx="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.4" />
      <text x="47" y="48" class="font-mono" font-size="12px" font-weight="700" text-anchor="middle" fill="#0f172a">8 + 2</text>
      <rect x="20" y="56" width="54" height="36" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" />
      <text x="47" y="81" class="font-mono" font-size="18px" font-weight="700" text-anchor="middle" fill="#0f172a">10</text>
      <text x="95" y="58" class="font-mono" font-size="11.5px" font-weight="700" text-anchor="middle" fill="#0f172a">+2</text>
      <text x="95" y="76" class="font-mono" font-size="15px" font-weight="700" text-anchor="middle" fill="#0f172a">←</text>
      <rect x="108" y="26" width="70" height="78" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.4" />
      <text x="143" y="48" class="font-mono" font-size="12px" font-weight="700" text-anchor="middle" fill="#334155">5 − 2</text>
      <rect x="116" y="56" width="54" height="36" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.4" />
      <text x="143" y="81" class="font-mono" font-size="18px" font-weight="700" text-anchor="middle" fill="#0f172a">3</text>
      <rect x="16" y="114" width="158" height="32" rx="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.3" />
      <text x="95" y="135" class="font-mono" font-size="14px" font-weight="700" text-anchor="middle" fill="#0f172a">[10] + 3 = 13 ✓</text>
      </svg>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(214, 44)">
