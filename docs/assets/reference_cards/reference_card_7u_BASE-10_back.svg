        <circle cx="18" cy="16" r="11" fill="#0f172a" />
        <text x="18" y="21" class="font-mono" font-size="14.5px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="35" y="21" class="font-mono" font-size="16px" font-weight="700" fill="#0f172a">ADD 3 ON BOTTOM</text>
        <text x="12" y="42" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">Place 3 Set B counters below → see 8</text><text x="12" y="59.5" class="font-sans" font-size="15.2px" font-weight="500" fill="#1e293b">as 5 + 3 instantly!</text>
      </g>
      <g transform="translate(214, 186)">
