<svg xmlns="http://www.w3.org/2000/svg" width="114.0mm" height="35.0mm" viewBox="0 0 1140 350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
      .font-mono { font-family: 'Space Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- 114.0 x 35.0 mm Cut Cell Background (2.6mm L/R & 2.2mm T/B symmetric white bleed/safe margin) -->
  <rect x="0" y="0" width="1140" height="350" fill="#ffffff" />

  <!-- Top Header Strip (x=26..1114, y=22..60) -->
  <rect x="26" y="22" width="1088" height="38" rx="8" fill="#0f172a" />
  <text x="38" y="38" class="font-mono" font-size="14.5px" font-weight="700" fill="#ffffff">NUMBER RACK (REKENREK) LAB — QUINARY SUBITIZING &amp; DOUBLES</text>
  <text x="38" y="53" class="font-mono" font-size="9.5px" fill="#94a3b8">HANDS-ON MATHEMATICAL EXPLORATIONS • STACKCALC.IO</text>
  <rect x="866" y="27" width="238" height="28" rx="6" fill="#334155" />
  <text x="985" y="45" class="font-mono" font-size="11.5px" font-weight="700" text-anchor="middle" fill="#ffffff">20-BEAD RACK • RACK-01</text>

  
  <!-- ACTIVITY 1 PANEL (y=66..294) -->
  <g transform="translate(26, 66)">
    <rect x="0" y="0" width="539" height="228" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="539" height="24" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <rect x="6" y="3.5" width="76" height="17" rx="4" fill="#0f172a" />
    <text x="44.0" y="15" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 1</text>
    <text x="88" y="15.5" class="font-mono" font-size="10.5px" font-weight="700" fill="#0f172a">5-AND-5 SUBITIZING (7 = 5 + 2 &amp; 10 − 3)</text>

    <!-- Left Illustrated Block Diagram (190 x 161) -->
    <g transform="translate(8, 28)">
      <rect x="0" y="0" width="190" height="161" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
      
      <rect x="14" y="20" width="162" height="112" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.3" />
      <rect x="24" y="32" width="66" height="42" rx="4" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.2" />
      <text x="57" y="57" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#0f172a">PART A</text>
      <rect x="100" y="32" width="66" height="42" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
      <text x="133" y="57" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#0f172a">PART B</text>
      <rect x="24" y="82" width="142" height="38" rx="4" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2" />
      <text x="95" y="105" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#0f172a">VERIFIED EQUIVALENCE</text>
      <text x="95" y="148" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#334155">STAGE ON COMPARISON LID</text>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(202, 28)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0f172a" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">CLEAR RODS RIGHT</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Slide all 20 beads to the right side of the rack (resting</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">'at home' position).</text>
      </g>
      <g transform="translate(202, 83)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0f172a" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">PUSH 7 IN ONE MOVE</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">On the top rod, slide the first group of 5 beads + 2 more</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">beads to the left in one sweep.</text>
      </g>
      <g transform="translate(202, 138)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0f172a" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">READ BOTH WAYS</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">See 7 instantly as 5 + 2 on the left, and 10 − 3 = 7 from</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">the 3 beads remaining on the right!</text>
      </g>

    <!-- Bottom Concept Takeaway Bar -->
    <rect x="8" y="195" width="523" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0" />
    <text x="14" y="211.5" class="font-sans" font-size="9.2px" font-weight="700" fill="#0f172a">★ KEY CONCEPT: <tspan font-weight="400" fill="#0f172a">Grouping beads in benchmark 5s eliminates counting by ones and builds instant 5-and-10 structure.</tspan></text>
  </g>
  <!-- ACTIVITY 2 PANEL (y=66..294) -->
  <g transform="translate(575, 66)">
    <rect x="0" y="0" width="539" height="228" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="539" height="24" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <rect x="6" y="3.5" width="76" height="17" rx="4" fill="#0f172a" />
    <text x="44.0" y="15" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 2</text>
    <text x="88" y="15.5" class="font-mono" font-size="10.5px" font-weight="700" fill="#0f172a">DOUBLES &amp; NEAR-DOUBLES (6 + 7 = 10 + 3 = 13)</text>

    <!-- Left Illustrated Block Diagram (190 x 161) -->
    <g transform="translate(8, 28)">
      <rect x="0" y="0" width="190" height="161" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
      
      <rect x="14" y="20" width="162" height="112" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.3" />
      <rect x="24" y="32" width="66" height="42" rx="4" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.2" />
      <text x="57" y="57" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#0f172a">PART A</text>
      <rect x="100" y="32" width="66" height="42" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
      <text x="133" y="57" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#0f172a">PART B</text>
      <rect x="24" y="82" width="142" height="38" rx="4" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2" />
      <text x="95" y="105" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#0f172a">VERIFIED EQUIVALENCE</text>
      <text x="95" y="148" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#334155">STAGE ON COMPARISON LID</text>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(202, 28)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0f172a" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">STAGE 6 AND 7</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Slide 6 beads (5 + 1) on Rod 1 and 7 beads (5 + 2) on Rod 2.</text>
      </g>
      <g transform="translate(202, 83)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0f172a" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">PAIR THE TWO 5s</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Look vertically at the two left groups of 5: 5 + 5 = 10!</text>
      </g>
      <g transform="translate(202, 138)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0f172a" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">ADD REMAINDERS</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Add the remaining beads (1 + 2 = 3) or see Doubles + 1 (6 +</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">6 + 1 = 13)!</text>
      </g>

    <!-- Bottom Concept Takeaway Bar -->
    <rect x="8" y="195" width="523" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0" />
    <text x="14" y="211.5" class="font-sans" font-size="9.2px" font-weight="700" fill="#0f172a">★ KEY CONCEPT: <tspan font-weight="400" fill="#0f172a">Two parallel 10-bead rods reveal both Make-a-Ten (10 + 3) and Near-Doubles (12 + 1) simultaneously.</tspan></text>
  </g>

  <!-- Bottom Solution & Storage Strip (x=26..1114, y=300..328) -->
  <rect x="26" y="300" width="1088" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1" />
  <rect x="30" y="304" width="166" height="20" rx="4" fill="#0f172a" />
  <text x="113" y="317.5" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">QUICK CLEANUP</text>
  <text x="206" y="318" class="font-sans" font-size="10.2px" font-weight="700" fill="#0f172a">Dock the 2-Rod Rekenrek frame and number tiles into the storage base and snap the stage lid shut!</text>
</svg>