<svg xmlns="http://www.w3.org/2000/svg" width="114.0mm" height="35.0mm" viewBox="0 0 1140 350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
      .font-mono { font-family: 'Space Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- 114.0 x 35.0 mm Cut Cell Background & Inset Safe Frame -->
  <rect x="0" y="0" width="1140" height="350" fill="#ffffff" />
  <rect x="16" y="14" width="1108" height="322" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />

  <!-- Top Header Strip -->
  <rect x="26" y="20" width="1088" height="38" rx="8" fill="#0f172a" />
  <text x="38" y="36" class="font-mono" font-size="14.5px" font-weight="700" fill="#ffffff">PRIME FACTOR STUDIO — PRIME TOWERS, GCF &amp; LCM</text>
  <text x="38" y="51" class="font-mono" font-size="9.5px" fill="#94a3b8">SIDE B • ILLUSTRATED CLASSROOM EXPLORATIONS &amp; SELF-CHECKING PACK-UP • STACKCALC LABS</text>
  <rect x="866" y="25" width="238" height="28" rx="6" fill="#059669" />
  <text x="985" y="43" class="font-mono" font-size="11.5px" font-weight="700" text-anchor="middle" fill="#ffffff">LOG₂ HEIGHTS • PRIME-01</text>

  
  <!-- ACTIVITY 1 PANEL -->
  <g transform="translate(26, 64)">
    <rect x="0" y="0" width="539" height="228" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="539" height="24" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="6" y="3.5" width="76" height="17" rx="4" fill="#0284c7" />
    <text x="44" y="15" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 1</text>
    <text x="90" y="15.5" class="font-mono" font-size="10.5px" font-weight="700" fill="#0f172a">UNIQUE PRIME TOWERS (12 = 2 × 2 × 3)</text>
    <text x="531" y="15.5" class="font-mono" font-size="9px" font-weight="700" text-anchor="end" fill="#0284c7">FUNDAMENTAL THEOREM</text>

    <!-- Left Illustrated Block Diagram (190 x 162) -->
    <g transform="translate(8, 28)">
      <rect x="0" y="0" width="190" height="161" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
      
      <text x="95" y="14" class="font-mono" font-size="9px" font-weight="700" text-anchor="middle" fill="#0369a1">EQUAL HEIGHT = EQUAL PRODUCT</text>
      <!-- Flush 25.1mm Waterline -->
      <line x1="12" y1="34" x2="132" y2="34" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2" />
      <text x="72" y="29" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#15803d">25.1mm FLUSH (12)</text>
      <!-- Tower 1: [2]+[2]+[3] (bottom to top: 2=28px, 2=28px, 3=44px -> total 100px, y=34..134) -->
      <rect x="20" y="34" width="42" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3" />
      <text x="41" y="60" class="font-mono" font-size="12px" font-weight="700" text-anchor="middle" fill="#991b1b">3</text>
      <rect x="20" y="78" width="42" height="28" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" />
      <text x="41" y="96" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#1e40af">2</text>
      <rect x="20" y="106" width="42" height="28" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" />
      <text x="41" y="124" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#1e40af">2</text>
      <!-- Tower 2: [3]+[2]+[2] (bottom to top: 3=44px, 2=28px, 2=28px -> total 100px) -->
      <rect x="76" y="34" width="42" height="28" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" />
      <text x="97" y="52" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#1e40af">2</text>
      <rect x="76" y="62" width="42" height="28" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" />
      <text x="97" y="80" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#1e40af">2</text>
      <rect x="76" y="90" width="42" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3" />
      <text x="97" y="116" class="font-mono" font-size="12px" font-weight="700" text-anchor="middle" fill="#991b1b">3</text>
      <!-- Tower 3: [2]+[5] = 10 (23.3mm -> 93px, y=41..134) -->
      <rect x="134" y="41" width="40" height="65" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.2" />
      <text x="154" y="77" class="font-mono" font-size="12px" font-weight="700" text-anchor="middle" fill="#334155">5</text>
      <rect x="134" y="106" width="40" height="28" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" />
      <text x="154" y="124" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#1e40af">2</text>
      <!-- Base Stage Line -->
      <line x1="12" y1="135" x2="180" y2="135" stroke="#0f172a" stroke-width="2" />
      <text x="41" y="148" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#0f172a">2·2·3=12</text>
      <text x="97" y="148" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#0f172a">3·2·2=12</text>
      <text x="154" y="148" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#dc2626">2·5=10≠12</text>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(202, 28)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0284c7" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">STACK 2 × 2 × 3 = 12</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Stack [2] + [2] + [3] on Lid Socket A1 (7.0 + 7.0 + 11.1</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">= 25.1mm logarithmic height).</text>
      </g>
      <g transform="translate(202, 83)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0284c7" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">TEST COMMUTATIVITY</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Stack [3] + [2] + [2] on Socket B1. Both towers stand</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">dead-flush at 25.1mm!</text>
      </g>
      <g transform="translate(202, 138)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0284c7" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">PROVE UNIQUENESS</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Try [2]+[5] (23.3mm = 10) or [3]+[5] (27.4mm = 15)—only</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">2·2·3 matches 25.1mm!</text>
      </g>

    <!-- Bottom Concept Takeaway Bar -->
    <rect x="8" y="195" width="523" height="26" rx="5" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.0" />
    <text x="14" y="211.5" class="font-sans" font-size="9.2px" font-weight="700" fill="#0369a1">★ KEY CONCEPT: <tspan font-weight="400" fill="#0f172a">Every composite number has one unique prime recipe; reordering factors never changes height.</tspan></text>
  </g>
  <!-- ACTIVITY 2 PANEL -->
  <g transform="translate(575, 64)">
    <rect x="0" y="0" width="539" height="228" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="539" height="24" rx="8" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1" />
    <rect x="6" y="3.5" width="76" height="17" rx="4" fill="#059669" />
    <text x="44" y="15" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 2</text>
    <text x="90" y="15.5" class="font-mono" font-size="10.5px" font-weight="700" fill="#0f172a">PHYSICAL GCF &amp; LCM (12 VS. 18)</text>
    <text x="531" y="15.5" class="font-mono" font-size="9px" font-weight="700" text-anchor="end" fill="#059669">SHARED BASE &amp; UNION</text>

    <!-- Left Illustrated Block Diagram (190 x 162) -->
    <g transform="translate(8, 28)">
      <rect x="0" y="0" width="190" height="161" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
      
      <text x="95" y="14" class="font-mono" font-size="9px" font-weight="700" text-anchor="middle" fill="#047857">GCF = SHARED BASE • LCM = UNION</text>
      <!-- Shared GCF Highlight Box across y=76..135 -->
      <rect x="14" y="75" width="106" height="61" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.4" stroke-dasharray="3,2" />
      <!-- Tower 12: [2](76..100) + [3](100..135) + top [2](52..76) -->
      <rect x="20" y="52" width="40" height="23" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" />
      <text x="40" y="67" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#1e40af">2</text>
      <rect x="20" y="76" width="40" height="35" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" />
      <text x="40" y="98" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#991b1b">3</text>
      <rect x="20" y="112" width="40" height="23" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" />
      <text x="40" y="127" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#1e40af">2</text>
      <!-- Tower 18: top [3](40..75) + shared [3](76..111) + [2](112..135) -->
      <rect x="72" y="40" width="40" height="35" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" />
      <text x="92" y="62" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#991b1b">3</text>
      <rect x="72" y="76" width="40" height="35" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" />
      <text x="92" y="98" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#991b1b">3</text>
      <rect x="72" y="112" width="40" height="23" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" />
      <text x="92" y="127" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#1e40af">2</text>
      <!-- LCM 36 Tower: [3]+[3]+[2]+[2] (y=19..135) -->
      <rect x="132" y="19" width="42" height="33" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" />
      <text x="153" y="39" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#991b1b">3</text>
      <rect x="132" y="53" width="42" height="33" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" />
      <text x="153" y="73" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#991b1b">3</text>
      <rect x="132" y="87" width="42" height="23" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" />
      <text x="153" y="102" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#1e40af">2</text>
      <rect x="132" y="111" width="42" height="24" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" />
      <text x="153" y="127" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#1e40af">2</text>
      <line x1="12" y1="136" x2="180" y2="136" stroke="#0f172a" stroke-width="2" />
      <text x="66" y="149" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#b45309">GCF(12,18)=6</text>
      <text x="153" y="149" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#047857">LCM=36</text>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(202, 28)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#059669" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">BUILD 12 AND 18</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Stage Tower 12 ([2]+[3]+[2] = 25.1mm) on A1 and Tower 18</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">([2]+[3]+[3] = 29.2mm) on B1.</text>
      </g>
      <g transform="translate(202, 83)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#059669" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">GCF = SHARED BASE</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Compare matching bases: both share [2] + [3] = 6</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">(18.1mm). Thus GCF(12, 18) = 6!</text>
      </g>
      <g transform="translate(202, 138)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#059669" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">LCM = PRIME UNION</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Combine the max count of each prime ([2]+[2]+[3]+[3]) to</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">build LCM = 36 (36.2mm).</text>
      </g>

    <!-- Bottom Concept Takeaway Bar -->
    <rect x="8" y="195" width="523" height="26" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.0" />
    <text x="14" y="211.5" class="font-sans" font-size="9.2px" font-weight="700" fill="#047857">★ KEY CONCEPT: <tspan font-weight="400" fill="#0f172a">GCF is the shared base height of two prime towers; LCM is their combined prime union.</tspan></text>
  </g>

  <!-- Bottom 10-Second Self-Checking Waterline Pack-Up Strip -->
  <rect x="26" y="298" width="1088" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1" />
  <rect x="30" y="302" width="166" height="20" rx="4" fill="#0f172a" />
  <text x="113" y="315.5" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#38bdf8">10-SEC BOX PACK-UP</text>
  <text x="206" y="316" class="font-sans" font-size="10.5px" font-weight="700" fill="#0f172a">Cols 0–1: 6×[2] | Front Cols 2–4: 3×[3] | Back Cols 2–4: 2×[5] | Col 5: 2×[7] → Stepped floors level all 12 at 42.0mm!</text>
</svg>