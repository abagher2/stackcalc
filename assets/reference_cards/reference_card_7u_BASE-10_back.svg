<svg xmlns="http://www.w3.org/2000/svg" width="114.0mm" height="35.0mm" viewBox="0 0 1140 350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
      .font-mono { font-family: 'Space Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- 114.0 x 35.0 mm Cut Cell Background (2.6mm L/R & 2.2mm T/B symmetric white bleed/safe margin) -->
  <rect x="0" y="0" width="1140" height="350" fill="#ffffff" />

  <!-- Top Header Strip (x=26..1114, y=22..60) -->
  <rect x="26" y="22" width="1088" height="38" rx="8" fill="#0f172a" />
  <text x="38" y="38" class="font-mono" font-size="14.5px" font-weight="700" fill="#ffffff">TEN-FRAMES ARITHMETIC LAB — 5-ANCHOR SUBITIZING &amp; MAKE-A-TEN</text>
  <text x="38" y="53" class="font-mono" font-size="9.5px" fill="#94a3b8">HANDS-ON MATHEMATICAL EXPLORATIONS • STACKCALC.IO</text>
  <rect x="866" y="27" width="238" height="28" rx="6" fill="#334155" />
  <text x="985" y="45" class="font-mono" font-size="11.5px" font-weight="700" text-anchor="middle" fill="#ffffff">5 &amp; 10 ANCHORS • BASE-10</text>

  
  <!-- ACTIVITY 1 PANEL (y=66..294) -->
  <g transform="translate(26, 66)">
    <rect x="0" y="0" width="539" height="228" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="539" height="24" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <rect x="6" y="3.5" width="76" height="17" rx="4" fill="#0f172a" />
    <text x="44.0" y="15" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 1</text>
    <text x="88" y="15.5" class="font-mono" font-size="10.5px" font-weight="700" fill="#0f172a">5-ANCHOR SUBITIZING (8 = 5 + 3 &amp; 10 − 2)</text>

    <!-- Left Illustrated Block Diagram (190 x 161) -->
    <g transform="translate(8, 28)">
      <rect x="0" y="0" width="190" height="161" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
      
      <text x="95" y="16" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#0f172a">5×2 TEN-FRAME: 8 = 5 + 3</text>
      <rect x="10" y="28" width="170" height="82" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" />
      <rect x="15" y="34" width="28" height="30" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" /><circle cx="29" cy="49" r="7" fill="#0f172a" /><rect x="47" y="34" width="28" height="30" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" /><circle cx="61" cy="49" r="7" fill="#0f172a" /><rect x="79" y="34" width="28" height="30" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" /><circle cx="93" cy="49" r="7" fill="#0f172a" /><rect x="111" y="34" width="28" height="30" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" /><circle cx="125" cy="49" r="7" fill="#0f172a" /><rect x="143" y="34" width="28" height="30" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" /><circle cx="157" cy="49" r="7" fill="#0f172a" /><rect x="15" y="70" width="28" height="30" rx="4" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.4" /><circle cx="29" cy="85" r="7" fill="#475569" /><rect x="47" y="70" width="28" height="30" rx="4" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.4" /><circle cx="61" cy="85" r="7" fill="#475569" /><rect x="79" y="70" width="28" height="30" rx="4" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.4" /><circle cx="93" cy="85" r="7" fill="#475569" /><rect x="111" y="70" width="28" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,2" /><rect x="143" y="70" width="28" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,2" />
      <text x="95" y="128" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#0f172a">TOP = 5 • BOTTOM = 3 → 8</text>
      <text x="95" y="146" class="font-mono" font-size="9px" font-weight="700" text-anchor="middle" fill="#334155">2 EMPTY SLOTS → 10 − 2 = 8</text>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(202, 28)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0f172a" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">FILL THE 5-ROW</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Lift out a 5×2 Ten-Frame Tray and fill the top row with 5</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">Set A counters (benchmark 5).</text>
      </g>
      <g transform="translate(202, 83)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0f172a" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">ADD 3 ON BOTTOM</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Place 3 Set B counters in the bottom row—see 8 immediately</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">as 5 + 3 without counting!</text>
      </g>
      <g transform="translate(202, 138)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0f172a" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">READ COMPLEMENT</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">The 2 empty sockets on the right show 8 + 2 = 10 and 10 − 8</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">= 2 at a single glance.</text>
      </g>

    <!-- Bottom Concept Takeaway Bar -->
    <rect x="8" y="195" width="523" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0" />
    <text x="14" y="211.5" class="font-sans" font-size="9.2px" font-weight="700" fill="#0f172a">★ KEY CONCEPT: <tspan font-weight="400" fill="#0f172a">The 5×2 grid anchors every quantity 1–10 to 5 and 10 so part-whole structure is visible instantly.</tspan></text>
  </g>
  <!-- ACTIVITY 2 PANEL (y=66..294) -->
  <g transform="translate(575, 66)">
    <rect x="0" y="0" width="539" height="228" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="539" height="24" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <rect x="6" y="3.5" width="76" height="17" rx="4" fill="#0f172a" />
    <text x="44.0" y="15" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 2</text>
    <text x="88" y="15.5" class="font-mono" font-size="10.5px" font-weight="700" fill="#0f172a">MAKE-A-TEN ADDITION BRIDGE (8 + 5 = 13)</text>

    <!-- Left Illustrated Block Diagram (190 x 161) -->
    <g transform="translate(8, 28)">
      <rect x="0" y="0" width="190" height="161" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
      
      <text x="95" y="15" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#0f172a">BRIDGE TO 10: 8 + 5 = 10 + 3</text>
      <!-- Left: Full Frame A = [10] Landmark Block (x=12..82) -->
      <rect x="12" y="26" width="70" height="76" rx="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.4" />
      <text x="47" y="48" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#0f172a">8 + 2 =</text>
      <rect x="22" y="58" width="50" height="32" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" />
      <text x="47" y="79" class="font-mono" font-size="15px" font-weight="700" text-anchor="middle" fill="#0f172a">10</text>
      <!-- Center transfer label in x=82..108 gap (zero overlap) -->
      <text x="95" y="58" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#0f172a">+2</text>
      <text x="95" y="72" class="font-mono" font-size="12px" font-weight="700" text-anchor="middle" fill="#0f172a">←</text>
      <!-- Right: Frame B with 3 remaining (x=108..178) -->
      <rect x="108" y="26" width="70" height="76" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.4" />
      <text x="143" y="48" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#334155">5 − 2 =</text>
      <rect x="118" y="58" width="50" height="32" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.4" />
      <text x="143" y="79" class="font-mono" font-size="15px" font-weight="700" text-anchor="middle" fill="#0f172a">3</text>
      <!-- Bottom Sum -->
      <rect x="20" y="110" width="150" height="26" rx="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.2" />
      <text x="95" y="127" class="font-mono" font-size="11px" font-weight="700" text-anchor="middle" fill="#0f172a">[10] + 3 = 13 ✓</text>
      <text x="95" y="151" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#334155">SWAP FULL FRAME FOR [10] BLOCK</text>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(202, 28)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0f172a" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">STAGE 8 AND 5</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Set 8 counters in Frame A (2 empty slots) and 5 contrasting</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">counters in Frame B.</text>
      </g>
      <g transform="translate(202, 83)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0f172a" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">COMPLETE THE 10</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Slide 2 counters from Frame B into Frame A's empty slots →</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">Frame A is now a full 10!</text>
      </g>
      <g transform="translate(202, 138)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0f172a" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">SWAP FOR [10] BLOCK</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Trade full Frame A for a [10] Landmark block + 3 remaining</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">in Frame B = 13!</text>
      </g>

    <!-- Bottom Concept Takeaway Bar -->
    <rect x="8" y="195" width="523" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0" />
    <text x="14" y="211.5" class="font-sans" font-size="9.2px" font-weight="700" fill="#0f172a">★ KEY CONCEPT: <tspan font-weight="400" fill="#0f172a">Decomposing 5 into 2 + 3 turns 8 + 5 into 10 + 3, making mental addition across ten automatic.</tspan></text>
  </g>

  <!-- Bottom Solution & Storage Strip (x=26..1114, y=300..328) -->
  <rect x="26" y="300" width="1088" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1" />
  <rect x="30" y="304" width="166" height="20" rx="4" fill="#0f172a" />
  <text x="113" y="317.5" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">FULL-STACK SOLUTION</text>
  <text x="206" y="318" class="font-sans" font-size="10.2px" font-weight="700" fill="#0f172a">Cols 0–4: 4 counters/socket (40 pcs) + 2× 5×2 Trays on Layers 5–6  •  Col 5: 6×[10] blocks/socket (12 pcs) → Level Full Stacks!</text>
</svg>