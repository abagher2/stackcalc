<svg xmlns="http://www.w3.org/2000/svg" width="114.0mm" height="35.0mm" viewBox="0 0 1140 350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
      .font-mono { font-family: 'Space Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- 114.0 x 35.0 mm Cut Cell Background & Inset Safe Frame -->
  <rect x="0" y="0" width="1140" height="350" fill="#ffffff" />
  <rect x="16" y="14" width="1108" height="322" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />

  <!-- Top Header Strip -->
  <rect x="26" y="20" width="1088" height="38" rx="8" fill="#0f172a" />
  <text x="38" y="36" class="font-mono" font-size="14.5px" font-weight="700" fill="#ffffff">TEN-FRAMES ARITHMETIC LAB — 5-ANCHOR SUBITIZING &amp; MAKE-A-TEN</text>
  <text x="38" y="51" class="font-mono" font-size="9.5px" fill="#94a3b8">SIDE B • ILLUSTRATED CLASSROOM EXPLORATIONS &amp; SELF-CHECKING PACK-UP • STACKCALC LABS</text>
  <rect x="866" y="25" width="238" height="28" rx="6" fill="#059669" />
  <text x="985" y="43" class="font-mono" font-size="11.5px" font-weight="700" text-anchor="middle" fill="#ffffff">5 &amp; 10 ANCHORS • BASE-10</text>

  
  <!-- ACTIVITY 1 PANEL -->
  <g transform="translate(26, 64)">
    <rect x="0" y="0" width="539" height="228" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="539" height="24" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="6" y="3.5" width="76" height="17" rx="4" fill="#0284c7" />
    <text x="44" y="15" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 1</text>
    <text x="90" y="15.5" class="font-mono" font-size="10.5px" font-weight="700" fill="#0f172a">5-ANCHOR SUBITIZING (8 = 5 + 3 &amp; 10 − 2)</text>
    <text x="531" y="15.5" class="font-mono" font-size="9px" font-weight="700" text-anchor="end" fill="#0284c7">NUMBER SENSE</text>

    <!-- Left Illustrated Block Diagram (190 x 162) -->
    <g transform="translate(8, 28)">
      <rect x="0" y="0" width="190" height="161" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
      
      <text x="95" y="16" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#0369a1">5×2 TEN-FRAME: 8 = 5 + 3</text>
      <rect x="10" y="28" width="170" height="82" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" />
      <rect x="15" y="34" width="28" height="30" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" /><circle cx="29" cy="49" r="7" fill="#0284c7" /><rect x="47" y="34" width="28" height="30" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" /><circle cx="61" cy="49" r="7" fill="#0284c7" /><rect x="79" y="34" width="28" height="30" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" /><circle cx="93" cy="49" r="7" fill="#0284c7" /><rect x="111" y="34" width="28" height="30" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" /><circle cx="125" cy="49" r="7" fill="#0284c7" /><rect x="143" y="34" width="28" height="30" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" /><circle cx="157" cy="49" r="7" fill="#0284c7" /><rect x="15" y="70" width="28" height="30" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.4" /><circle cx="29" cy="85" r="7" fill="#d97706" /><rect x="47" y="70" width="28" height="30" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.4" /><circle cx="61" cy="85" r="7" fill="#d97706" /><rect x="79" y="70" width="28" height="30" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.4" /><circle cx="93" cy="85" r="7" fill="#d97706" /><rect x="111" y="70" width="28" height="30" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,2" /><rect x="143" y="70" width="28" height="30" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,2" />
      <text x="95" y="128" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#0f172a">TOP = 5 • BOTTOM = 3 → 8</text>
      <text x="95" y="146" class="font-mono" font-size="9px" font-weight="700" text-anchor="middle" fill="#059669">2 EMPTY SLOTS → 10 − 2 = 8</text>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(202, 28)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0284c7" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">FILL THE 5-ROW</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Lift out a 5×2 Ten-Frame Tray and fill the top row with</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">5 White counters (benchmark 5).</text>
      </g>
      <g transform="translate(202, 83)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0284c7" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">ADD 3 ON BOTTOM</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Place 3 Tan counters in the bottom row—see 8 immediately</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">as 5 + 3 without counting!</text>
      </g>
      <g transform="translate(202, 138)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#0284c7" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">READ COMPLEMENT</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">The 2 empty sockets on the right show 8 + 2 = 10 and 10</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">− 8 = 2 at a single glance.</text>
      </g>

    <!-- Bottom Concept Takeaway Bar -->
    <rect x="8" y="195" width="523" height="26" rx="5" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.0" />
    <text x="14" y="211.5" class="font-sans" font-size="9.2px" font-weight="700" fill="#0369a1">★ KEY CONCEPT: <tspan font-weight="400" fill="#0f172a">The 5×2 grid anchors every quantity 1–10 to 5 and 10 so part-whole structure is visible instantly.</tspan></text>
  </g>
  <!-- ACTIVITY 2 PANEL -->
  <g transform="translate(575, 64)">
    <rect x="0" y="0" width="539" height="228" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="539" height="24" rx="8" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1" />
    <rect x="6" y="3.5" width="76" height="17" rx="4" fill="#059669" />
    <text x="44" y="15" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">ACTIVITY 2</text>
    <text x="90" y="15.5" class="font-mono" font-size="10.5px" font-weight="700" fill="#0f172a">MAKE-A-TEN ADDITION BRIDGE (8 + 5 = 13)</text>
    <text x="531" y="15.5" class="font-mono" font-size="9px" font-weight="700" text-anchor="end" fill="#059669">BRIDGING TEN</text>

    <!-- Left Illustrated Block Diagram (190 x 162) -->
    <g transform="translate(8, 28)">
      <rect x="0" y="0" width="190" height="161" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
      
      <text x="95" y="15" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#047857">BRIDGE TO 10: 8 + 5 = 10 + 3</text>
      <!-- Left: Full Frame A = [10] Landmark Block -->
      <rect x="14" y="28" width="74" height="74" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6" />
      <text x="51" y="54" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#166534">8 + 2 =</text>
      <rect x="26" y="62" width="50" height="30" rx="4" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
      <text x="51" y="82" class="font-mono" font-size="15px" font-weight="700" text-anchor="middle" fill="#158034">10</text>
      <!-- Arrow moving 2 counters from B to A -->
      <path d="M 118 42 Q 95 22 86 40" fill="none" stroke="#d97706" stroke-width="1.6" />
      <text x="98" y="29" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#b45309">+2</text>
      <!-- Right: Frame B with 3 remaining -->
      <rect x="102" y="28" width="74" height="74" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
      <text x="139" y="54" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#92400e">5 − 2 =</text>
      <rect x="114" y="62" width="50" height="30" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.4" />
      <text x="139" y="82" class="font-mono" font-size="15px" font-weight="700" text-anchor="middle" fill="#b45309">3</text>
      <!-- Bottom Sum -->
      <rect x="20" y="112" width="150" height="28" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" />
      <text x="95" y="130" class="font-mono" font-size="11.5px" font-weight="700" text-anchor="middle" fill="#166534">[10] + 3 = 13 ✓</text>
      <text x="95" y="152" class="font-mono" font-size="8.5px" font-weight="700" text-anchor="middle" fill="#475569">SWAP FULL FRAME FOR [10] BLOCK</text>
    </g>

    <!-- Right 3-Step Walkthrough -->
    
      <g transform="translate(202, 28)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#059669" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">STAGE 8 AND 5</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Set 8 White counters in Frame A (2 empty slots) and 5</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">Tan counters in Frame B.</text>
      </g>
      <g transform="translate(202, 83)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#059669" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">COMPLETE THE 10</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Slide 2 Tan counters from Frame B into Frame A's empty</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">slots → Frame A is now a full 10!</text>
      </g>
      <g transform="translate(202, 138)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#059669" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">SWAP FOR [10] BLOCK</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Trade full Frame A for a [10] Landmark block + 3</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">remaining in Frame B = 13!</text>
      </g>

    <!-- Bottom Concept Takeaway Bar -->
    <rect x="8" y="195" width="523" height="26" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.0" />
    <text x="14" y="211.5" class="font-sans" font-size="9.2px" font-weight="700" fill="#047857">★ KEY CONCEPT: <tspan font-weight="400" fill="#0f172a">Decomposing 5 into 2 + 3 turns 8 + 5 into 10 + 3, making mental addition across ten automatic.</tspan></text>
  </g>

  <!-- Bottom 10-Second Self-Checking Waterline Pack-Up Strip -->
  <rect x="26" y="298" width="1088" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1" />
  <rect x="30" y="302" width="166" height="20" rx="4" fill="#0f172a" />
  <text x="113" y="315.5" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#38bdf8">10-SEC BOX PACK-UP</text>
  <text x="206" y="316" class="font-sans" font-size="10.5px" font-weight="700" fill="#0f172a">Cols 0–4: 4 counters/socket (40 pcs) + 2× 5×2 Trays on L5–L6 | Col 5: 6×[10] blocks/socket (12 pcs) → Flush at 42.0mm!</text>
</svg>