  <text x="113" y="317.5" class="font-mono" font-size="9.5px" font-weight="700" text-anchor="middle" fill="#ffffff">12-STACK SOLUTION</text>
  <text x="206" y="318" class="font-sans" font-size="10.2px" font-weight="700" fill="#0f172a">2× [1]  •  1× [5/5]  •  2× [1/2 + 5/10]  •  2× [2/4 + 4/8]  •  3× [1/3 + 2/6 + 3/9]  •  2× [1/2 + 6/12]  (All 12 stacks = 1 Whole!)</text>
</svg>