        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">THE 12-WHOLE PROBLEM</text>
        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Stacking 10×[1/10] or 12×[1/12] alone uses too many small</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">pieces. Can you cap every stack at 6–7 blocks?</text>
