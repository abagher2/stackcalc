        <text x="26" y="30" class="font-sans" font-size="9.5px" fill="#1e293b">Use larger fractions as half-stack bases: pair 1×[1/2] with</text><text x="26" y="42.5" class="font-sans" font-size="9.5px" fill="#1e293b">5×[1/10] or 6×[1/12], and 2×[1/4] with 4×[1/8]!</text>
