        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">7 + 5 = 12. Leave [2] in Ones and seat a Red [+1] Carry</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">block on the Tens column.</text>
