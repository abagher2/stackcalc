      <text x="152" y="78" class="font-mono" font-size="12px" font-weight="700" text-anchor="middle" fill="#64748b">0</text>
      <!-- Row 2: Subtrahend - 0 . 7 5 -->
      <rect x="14" y="90" width="44" height="24" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2" />
      <text x="36" y="106" class="font-mono" font-size="12px" font-weight="700" text-anchor="middle" fill="#1e3a8a">−0</text>
