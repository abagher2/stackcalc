        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Set [2] in Ones and [4][0] in .1 | .01 on the Decimal</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">Tray; place [0] • [7][5] below.</text>
      </g>
      <g transform="translate(202, 83)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#059669" />
