  <text x="206" y="316" class="font-sans" font-size="10.5px" font-weight="700" fill="#0f172a">Cols 0–4: 4 digits/socket (2W+2B) + 2× 5×2 Trays on L5–L6 | Col 5: 6 blocks/socket (4×[+1]+2×[0] &amp; 4×[10]+2×[0]) → Flush at 42.0mm!</text>
</svg>