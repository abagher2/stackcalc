        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">4 + 8 + [+1] = 13 Tens: leave [3] in Tens, carry [+1] to</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">100s (3+2+1 = 6 → read 632).</text>
