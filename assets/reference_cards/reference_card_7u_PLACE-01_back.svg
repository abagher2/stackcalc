      <rect x="134" y="38" width="36" height="20" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3" />
      <text x="152" y="52" class="font-mono" font-size="10.5px" font-weight="700" text-anchor="middle" fill="#b91c1c">10</text>
      <!-- Row 1: Minuend 2 . 4 0 -->
      <rect x="14" y="62" width="44" height="24" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
