        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Place White [3][4][7] in Row 1 and Blue [2][8][5] in Row</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">2 of 100 | 10 | 1 on the Whole Tray.</text>
