      </g>
      <g transform="translate(202, 138)">
        <rect x="0" y="0" width="329" height="51" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" />
        <circle cx="13" cy="13" r="8" fill="#059669" />
        <text x="13" y="16.5" class="font-mono" font-size="10px" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
        <text x="26" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0f172a">BORROW 1 ONE → 1.65</text>
        <text x="26" y="30" class="font-sans" font-size="9.6px" fill="#1e293b">Trade 1 One ([2]→[1]) for a [10] Borrow token in Tenths</text><text x="26" y="42.5" class="font-sans" font-size="9.6px" fill="#1e293b">(13 − 7 = 6) → read 1.65!</text>
