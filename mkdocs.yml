site_name: StackCalc32
site_description: "StackCalc: Handheld Reverse Polish Notation (RPN) calculators, precision physical math manipulatives (Ten-Frames, Fraction Towers, Math Dominoes, Algebra Tiles), and open-source STEM learning systems."
site_author: "StackCalc Engineering"
site_url: "https://www.stackcalc.io"

extra_css:
  - stylesheets/brutalist.css
  - stylesheets/ecommerce.css
  - stylesheets/manipulatives-lab.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/ecommerce.js
  - javascripts/manipulatives-lab.js

theme:
  name: material
  custom_dir: overrides
  logo: assets/stackcalc-logo.svg
  favicon: assets/stackcalc-logo.svg
  font:
    text: Inter
    code: Space Mono
  palette:
    - scheme: slate
      primary: black
      accent: cyan
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top

plugins:
  - search

hooks:
  - hooks/book_macros.py

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

