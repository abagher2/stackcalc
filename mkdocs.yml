site_name: StackCalc32
site_description: "A high-quality, everyday-use RPN calculator for a new generation."
site_author: "StackCalc Engineering"
site_url: "https://www.stackcalc.io"

extra_css:
  - stylesheets/brutalist.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

theme:
  name: material
  custom_dir: overrides
  logo: assets/stackcalc-logo.svg
  favicon: assets/stackcalc-logo.svg
  font:
    text: Inter
    code: Space Mono
  palette:
    - scheme: slate
      primary: black
      accent: cyan
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top

plugins:
  - search
  - blog:
      post_date_format: full
      draft_if_future_date: true
      

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

nav:
  - Home: index.md
  - Engineering Blog: blog/index.md
  - Documentation:
    - Learning Lab: learning-lab.md
    - Hardware & Rubric: hardware.md
    - Firmware: firmware.md
    - iOS App: ios_app.md
    - Tutorials: tutorials.md
  - Legal & Support:
    - Privacy Policy: privacy.md
    - Terms of Service: terms.md
    - Support: support.md
