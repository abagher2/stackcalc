site_name: StackCalc32
site_description: "StackCalc: Handheld Reverse Polish Notation (RPN) calculators, precision physical math manipulatives (Ten-Frames, Fraction Towers, Math Dominoes, Algebra Tiles), and open-source STEM learning systems."
site_author: "StackCalc Engineering"
site_url: "https://www.stackcalc.io"

extra_css:
  - stylesheets/brutalist.css
  - stylesheets/ecommerce.css
  - stylesheets/manipulatives-lab.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/ecommerce.js
  - javascripts/manipulatives-lab.js

theme:
  name: material
  custom_dir: overrides
  logo: assets/stackcalc-logo.svg
  favicon: assets/stackcalc-logo.svg
  font:
    text: Inter
    code: Space Mono
  palette:
    - scheme: slate
      primary: black
      accent: cyan
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top

plugins:
  - search

hooks:
  - hooks/book_macros.py

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

nav:
  - Home: index.md
  - 2D Learning Lab:
      - Virtual Manipulatives Suite: learning-lab.md
      - Fraction Towers Simulator: lab/fraction-studio.md
      - Prime Factor Simulator: lab/prime-factor-studio.md
  - Tactile Manipulatives:
      - All Launched Kits & Stores: products.md
      - Fraction Studio: products/fraction-studio/index.md
      - Prime Factor Studio: products/prime-factor-studio/index.md
      - Place Value Studio: products/place-value/index.md
  - Free 3D Printables (3MF): printables.md
  - Free PDF Downloads: downloads.md
  - Engineering Blog & Build Logs ↗: https://hackaday.io/project/206743-stackcalc32-a-tactile-rpn-calculator
  - Support & Legal:
      - Support & Contact: support.md
      - Privacy Policy: privacy.md

exclude_docs: |
  hackaday/**
  curriculum/**
  manuals/**
  api/**
  etsy-publishing-guide.md
  hardware.md
  firmware.md
  ios_app.md
  tutorials.md
  press.md
  shipping-and-packaging.md
  exam-compliance.md
  terms.md
  parts.md
  products/**/assembly.md
  products/**/lessons.md
  products/sc32-calculator/**
  products/sc6-elementary.md
  products/sc6-book.md
  products/classroom-clock/**
  products/ten-frames/**
  products/counting-tiles/**
  products/math-dominoes/**
  products/quest-scoreboard/**
  products/algebra-boxes/**
  products/dice-and-spinner/**
  products/unit-circle-volvelle.md
  products/stands-and-pouches.md
  products/curriculum-and-decks.md

not_in_nav: |
  hackaday/**
  curriculum/**
  manuals/**
  api/**
  etsy-publishing-guide.md
  hardware.md
  firmware.md
  ios_app.md
  tutorials.md
  press.md
  shipping-and-packaging.md
  exam-compliance.md
  terms.md
  parts.md
  products/**/assembly.md
  products/**/lessons.md
  products/classroom-clock/**
  products/ten-frames/**
  products/counting-tiles/**
  products/math-dominoes/**
  products/quest-scoreboard/**
  products/algebra-boxes/**
  products/dice-and-spinner/**
  products/unit-circle-volvelle.md
  products/stands-and-pouches.md
  products/curriculum-and-decks.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
    absolute_links: warn


